<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 信息素养与科研工具速查手册 v2.2.0 | 单文件离线运行 | 资源地图：15 类 / 10 学科 / 8 幕科研流程 | 键盘打开网址走真实 <a> 激活 | 已应用网址勘误 -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息素养与科研工具速查手册</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --dim:#5c6672; --line:#e2e6ea;
  --brand:#1e67ca; --brand-soft:#e8f2ff; --warn:#b45309; --warn-soft:#fef3c7;
  --ok:#15803d; --ok-soft:#dcfce7; --lock:#b91c1c; --lock-soft:#fee2e2;
  --kbd:#eef1f4; --kbd-line:#c9d1d9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;}
kbd{display:inline-block;min-width:18px;padding:1px 5px;margin:0 1px;
  font:600 11px/1.5 ui-monospace,Consolas,monospace;color:#334;
  background:var(--kbd);border:1px solid var(--kbd-line);border-bottom-width:2px;
  border-radius:4px;text-align:center}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.04);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{font-weight:400;color:var(--dim);margin-left:6px}
.search-wrap{position:relative;flex:1;min-width:260px}
#q{width:100%;padding:9px 12px 9px 34px;font-size:14px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);outline:none;font-family:inherit}
#q:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:13px;opacity:.6}
.hbtns{display:flex;gap:6px;align-items:center}
.hbtns button{padding:6px 10px;font:inherit;font-size:12.5px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink)}
.hbtns button:hover{border-color:var(--brand);color:var(--brand)}
.stats{color:var(--dim);font-size:12.5px;white-space:nowrap}

main{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 57px)}
#side{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 40px}
#detail{overflow-y:auto;padding:20px 26px 60px}

.use{border-bottom:1px solid var(--line)}
.use-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  font-weight:600;font-size:13.5px;user-select:none}
.use-head:hover{background:var(--brand-soft)}
.use-head .cnt{margin-left:auto;font-weight:400;color:var(--dim);font-size:11.5px}
.use.open .use-head{background:var(--brand-soft);color:var(--brand)}
.use .mods{display:none;padding-bottom:4px}
.use.open .mods{display:block}
.mod{display:flex;gap:7px;align-items:baseline;padding:5px 12px 5px 16px;cursor:pointer;
  font-size:13px;border-left:3px solid transparent}
.mod:hover{background:#f0f4f9}
.mod.sel{background:var(--brand-soft);border-left-color:var(--brand);font-weight:600}
.mod .idx{font:600 10.5px/1.6 ui-monospace,Consolas,monospace;color:#889;flex:none}
.mod.sel .idx{color:var(--brand)}

h1{font-size:19px;margin:0 0 6px}
.crumb{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.crumb b{color:var(--brand)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.actions a,.actions button{padding:6px 12px;font:inherit;font-size:12.5px;border-radius:7px;
  border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.actions a:hover,.actions button:hover{border-color:var(--brand);color:var(--brand);text-decoration:none}

section{margin-bottom:22px}
h2{font-size:14px;margin:0 0 9px;padding-bottom:6px;border-bottom:2px solid var(--brand-soft);
  color:var(--brand);letter-spacing:.3px}
ul.req{margin:0;padding-left:20px}
ul.req li{margin:3px 0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:5px 8px;border-radius:6px;margin-bottom:3px}
ul.plain li:nth-child(odd){background:#fafbfc}

.q{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px;background:#fff}
.q .qtype{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand);font-weight:600;margin-bottom:7px}
.q .stem{font-weight:600;margin-bottom:8px}
.q .opts{margin:0 0 8px;padding-left:0;list-style:none;color:#333}
.q .opts li{padding:1px 0}
.ans{background:var(--ok-soft);color:#14532d;padding:6px 10px;border-radius:6px;font-weight:600;
  display:inline-block;margin-bottom:6px}
.exp{color:#444;font-size:13px;border-left:3px solid var(--line);padding-left:10px}

ol.links{list-style:none;margin:0;padding:0;counter-reset:none}
ol.links li{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:7px;
  margin-bottom:2px}
ol.links li:nth-child(odd){background:#fafbfc}
ol.links li.hot{outline:2px solid var(--brand);background:var(--brand-soft)}
.lk{flex:1;min-width:0;word-break:break-all}
.lk .lab{font-weight:600}
.lk .u{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
.tag{flex:none;font-size:10.5px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.tag.login{background:var(--lock-soft);color:var(--lock)}
.tag.mixed{background:var(--warn-soft);color:var(--warn)}
.tag.gov{background:#e0e7ff;color:#3730a3}
.tag.open{background:var(--ok-soft);color:var(--ok)}
.hint{color:var(--dim);font-size:12px;margin-bottom:8px}

.mask{position:fixed;inset:0;background:rgba(15,20,26,.45);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:70px 16px 20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(880px,100%);max-width:100%;min-width:0;
  max-height:78vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;
  position:sticky;top:0;background:#fff;z-index:2}
.modal .body{padding:14px 18px 20px;overflow-x:hidden}
#catalogView,#platlist{min-width:0}
.kbdgrid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center}
.kbdgrid .k{white-space:nowrap}
.kbdgrid .d{color:#333}
.kgroup{grid-column:1/-1;margin-top:12px;font-weight:700;color:var(--brand);font-size:13px}
.plat{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer;min-width:0}
.plat:hover{background:var(--brand-soft)}
.plat.hot{outline:2px solid var(--brand);background:var(--brand-soft)}
.plat .nm{font-weight:600;min-width:180px;overflow-wrap:anywhere}
.plat .hs{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#platq{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:10px;font:inherit;outline:none}
#platq:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* ---------- 科研资源地图 ---------- */
.ptabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.ptab{padding:8px 14px;font:inherit;font-size:13px;background:transparent;border:0;
  border-bottom:2px solid transparent;cursor:pointer;color:var(--dim)}
.ptab:hover{color:var(--brand)}
.ptab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-width:0}
.chip{padding:4px 9px;font:inherit;font-size:11.5px;border:1px solid var(--line);
  border-radius:999px;background:#fff;cursor:pointer;color:#445;max-width:100%;
  white-space:normal;text-align:left}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .n{opacity:.75;margin-left:4px;font-size:10.5px}
.grp{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.4px}
.grp small{font-weight:400;color:var(--dim);margin-left:6px}
.plat .note{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:330px}
.plat .cat{flex:none;font-size:10.5px;padding:1px 6px;border-radius:99px;
  background:#eef1f4;color:#556}
.flowstage{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.flowstage h4{margin:0 0 4px;font-size:14px}
.flowstage .goal{color:var(--dim);font-size:12.5px;margin-bottom:8px}
.flowstage .tips{margin:0 0 8px;padding-left:18px;font-size:12.5px}
.flowstage .tips li{margin:2px 0}
.flowstage .pit{background:var(--warn-soft);color:#7c2d12;border-radius:6px;
  padding:5px 9px;font-size:12px;margin-bottom:8px}
.ftools{display:flex;flex-wrap:wrap;gap:6px}
.ftool{padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;
  cursor:pointer;font:inherit;font-size:11.5px;color:var(--brand)}
.ftool:hover{background:var(--brand-soft);border-color:var(--brand)}
.badge.flow{background:var(--warn-soft);color:var(--warn)}
@media(max-width:860px){.plat .note{display:none}.plat .nm{min-width:120px}}

#results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.13);max-height:62vh;overflow:auto;
  display:none;z-index:60}
#results.on{display:block}
#results .r{padding:7px 12px;cursor:pointer;display:flex;gap:9px;align-items:baseline;
  border-bottom:1px solid #f2f4f6}
#results .r:last-child{border-bottom:0}
#results .r.hot{background:var(--brand-soft)}
#results .r .t{font-weight:600}
#results .r .s{color:var(--dim);font-size:11.5px;margin-left:auto;white-space:nowrap}
#results .r .u{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.badge{font-size:10.5px;padding:1px 6px;border-radius:99px;background:#eef1f4;color:#556;flex:none}
.badge.mod{background:var(--brand-soft);color:var(--brand)}
.badge.url{background:var(--ok-soft);color:var(--ok)}

@media(max-width:860px){
  main{grid-template-columns:1fr;height:auto}
  #side{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  #detail{padding:16px}
  .mask{padding:18px 8px}
  .modal{max-height:92vh}
  .modal h3{font-size:13px;line-height:1.45;padding:11px 13px;white-space:normal}
  .modal .body{padding:12px 13px 16px}
  .ptab{font-size:12.5px;padding:7px 10px}
  .chip{font-size:11px;padding:3px 7px}
  .plat{flex-wrap:wrap;gap:3px 7px}
  .plat .nm{min-width:0;flex:1 1 auto}
  .plat .hs{order:3;width:100%;padding-left:22px;font-size:10.5px}
  .plat .cat{order:4;margin-left:22px}
  .plat .tag{order:4}
  .flowstage{padding:10px 11px}
}

/* 打开方式切换按钮 —— 命中时高亮“当前标签页”这一更保守的模式 */
#btn-mode{font-weight:600}
#btn-mode.same{background:var(--warn-soft);border-color:#f0c36d;color:var(--warn)}

/* 轻提示：网址被打开后显示，并提供“复制链接”兜底 */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
  display:none;align-items:center;gap:10px;max-width:92vw;
  padding:9px 12px;background:#1f2937;color:#f3f4f6;border-radius:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:12.5px;z-index:200}
#toast.on{display:flex;animation:tin .18s ease-out forwards}
@keyframes tin{to{transform:translate(-50%,0)}}
#toast .tmsg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw;
  font-family:ui-monospace,Consolas,monospace}
#toast button{padding:4px 9px;font:inherit;font-size:12px;border-radius:6px;cursor:pointer;
  border:1px solid #4b5563;background:#374151;color:#f3f4f6;flex:none}
#toast button:hover{border-color:#9ca3af}
#toast .tclose{background:transparent;border:0;font-size:15px;line-height:1;padding:2px 4px}
</style>
</head>

  </div>
</div></div>

"在爱思唯尔的科研级AI平台LeapSpace中，哪项功能能够帮助学者高效、便捷地识别AI所生成的陈述观点与现有文献之间的关联及其匹配程度？（ ）。","options":[["A","实验对比"],["B","深度研究"],["C","Claim Radar"],["D","私有文档上传"]],"answer":"C","explain":"查看该网站，并了解具体功能。网址：https://www.sciencedirect.com/leapspace/。Claim Radar可清晰直观地展示已有文献中与某陈述的关联及匹配程度，例如哪些文献支持此论述，哪些持中立态度，哪些与之相悖，方便用户辩证看待LeapSpace给出的观点与结论。故选C"},{"type":"单选题","stem":"CNKI AI有一个观点网络全景分析功能，具体是在哪个模块下？（ ）","options":[["A","知识问答-Deep Research模式"],["B","学术趋势分析"],["C","智能研读-专题简报"],["D","智能研读－知识卡片"]],"answer":"A","explain":"在知识问答页面开启Deep Research模式，生成的回答内容支持观点网络全景分析，梳理契合、互补、多元三大观点集合，可视化呈现领域研究观点分布，故选A"}],"links":[{"u":"https://www.sciencedirect.com/leapspace","label":"LeapSpace","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://ai.cnki.net/chat/home","label":"CNKI AI","host":"ai.cnki.net","access":"login","src":"page"},{"u":"https://paper.iflytek.com/","label":"https://paper.iflytek.com/","host":"paper.iflytek.com","access":"open","src":"page"},{"u":"https://www.sciencedirect.com/leapspace/","label":"https://www.sciencedirect.com/leapspace/","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://eci.elsevier.cn/resource/LeapSpace.html?fid=165&menuid=358&infoid=2004","label":"https://eci.elsevier.cn/resource/LeapSpace.html?fid=165&menuid=358&infoid=2004","host":"eci.elsevier.cn","access":"login","src":"page"},{"u":"https://mp.weixin.qq.com/s/yMzjuReWiBDgP6sJLkSA-A","label":"https://mp.weixin.qq.com/s/yMzjuReWiBDgP6sJLkSA-A","host":"mp.weixin.qq.com","access":"open","src":"page"}],"kw":["LeapSpace","Research","Writing","AMiner","Claim","Coach","Radar","Trust","CNKI","Card","Deep"]},{"no":6,"id":"ecee935f-46a5-11f0-8ca6-b8599f11e190","title":"知识模块06：多模态AI工具","use":"U1","legacy":"AI素养","detail":"https://csc.xxsuyang.com/detail?id=ecee935f-46a5-11f0-8ca6-b8599f11e190","req":["1. 熟悉豆包、智谱清言、万相（通义万相）、可灵AI的图像生成、视频生成功能。","2. 熟悉豆包的音乐生成功能。","3. 熟悉文心、讯飞星火的图像生成功能。","4. 了解闪剪、蝉镜等数字人工具。"],"explore":[],"questions":[{"type":"多选题","stem":"使用AI工具豆包可以生成音乐，入口在官网首页对话框下方。使用 README"]},{"no":8,"id":"ecee9f26-46a5-11f0-8ca6-b8599f11e190","title":"知识模块08：思政信息资源","use":"U4","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee9f26-46a5-11f0-8ca6-b8599f11e190","req":["1.能够从人民网推出的“习近平系列重要讲话数据库”（http://jhsjk.people.cn）中找到指定资源。","2.能够从共产党员网（https://www.12371.cn）中找到指定资源。","3.能够从全国高校课程思政教学资源服务平台（https://xhsz.news.cn）中找到指定资源。"],"explore":["1.根据学习要求中提供的网址，进入相关网站，深度体验、探索，熟悉这些网站中的内容。。","3.探索：习近平总书记在哪些场合提到过“数字素养与技能”？","4.探索：共产党员网中有哪些可以下载mp4格式视频的党建学习资源？","5.探索：在全国高校课程思政教学资源服务平台中找一门国家级课程思政示范课程。"],"questions":[{"type":"判断题","stem":"在“习近平系列重要讲话数据库”中可以查到习近平总书记在二十国集团领导人第十五次峰会第一阶段会议上的讲话，其中提到了“数字货币”，这是习近平总书记在正式发言或署名文章中第一次提到数字货币。","options":[],"answer":"错误","explain":"在“习近平系列重要讲话数据库”中以全文为检索点，以“数字货币”为检索词，可以找到至少多条记录，其中可以发现 2020 年 10 月 31 日在《求是》发表的《国家中长期经济社会发展战略若干重大问题》署名文章中就提到了“数字货币”，所以题目表述错误。"}],"links":[{"u":"http://jhsjk.people.cn","label":"http://jhsjk.people.cn","host":"jhsjk.people.cn","access":"open","src":"page"},{"u":"https://www.12371.cn","label":"https://www.12371.cn","host":"www.12371.cn","access":"open","src":"page"},{"u":"https://xhsz.news.cn/","label":"https://xhsz.news.cn","host":"xhsz.news.cn","access":"open","src":"page"},{"u":"https://xhsz.news.cn","label":"","host":"xhsz.news.cn","access":"open","src":"page"}],"kw":["jhsjk.people.cn","www.12371.cn","xhsz.news.cn","https","http","mp4"]},{"no":9,"id":"ecee97ae-46a5-11f0-8ca6-b8599f11e190","title":"知识模块09：开放数据资源","use":"U4","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee97ae-46a5-11f0-8ca6-b8599f11e190","req":["1. 能够通过国家统计局网站上的数据查询系统（https://data.stats.gov.cn/dg/website/page.html#/pc/national/home ，可能会有风险提示，忽略即可）查询统计数据。","2. 能够在国家统计局、各省市统计局、各部委官网中找到各种统计年鉴，并且从中找到指定指标数据。","3. 能够找到各省会城市和副省级城市的政府公共数据开放平台，并且从中找到指定数据或数据集。","4. 通过国家科学数据中心（https://www.escience.org.cn/data-center）旗下的20个具体学科科学数据中心获取指定数据资源。","5. 能够通过科学数据银行 ScienceDB（https://www.scidb.cn）获取指定科学数据资源。","6. 能够通过世界银行（https://data.worldbank.org）等国际组织网站中的开放数据平台查询指定数据和数据集。","7. 能够利用AI知数等数据智能分析平台，查询并分析经济、人口、教育、科技等领域的指标数据，完成指标检索、地区比较、时间趋势分析和简单数据运算。"],"explore":["1. 根据学习要求中提供的网址，深度体验、探索，熟悉这些网站的内容。","2. 探索：能够获取的最近一年的《海南统计年鉴》共有多少页？各省市统计年鉴一般可以在对应地方政府统计局网站中找到，虽然每个网站的界面不一样，但统计年鉴存放的位置一般比较明显，大部分可以在首页中找到。","3. 探索：能不能找到深圳市公共厕所的相关数据集？各地方政府的开放数据平台，最好能够获取其中的数据集（xlsx、csv、rdf、xml等格式文件）。","4. 探索：在世界银行的开放数据平台中对比我国和美国、日本、德国的GDP数据。","5. 探索：在科学数据银行 ScienceDB 中查找一个科学数据集，查看其题名、作者、发布时间、DOI 或 CSTR、数据文件和下载方式。"],"questions":[{"type":"单选题","stem":"在国家统计局官网的数据查询 系统中查找我国普通本专科生毕业人数。请问：2018 年我国普通本专科毕业生人数是多少万？（ ）","options":[["A","801.2213"],["B","797.1991"],["C","758.5298"],["D","753.3087"]],"answer":"D","explain":"登录国家统计局网站，点击“统计数据”菜单中找到数据查询，在查询页面输入关键词“普通本专科生毕业人数”，在找到的数据项中点击 相关报表，右上角选择“最近10年”，即可看到答案。"},{"type":"单选题","stem":"根据AI知数分析数据，2025年，我国哪个省份城镇居民人均可支配收入最高？（）","options":[["A","北京"],["B","上海"],["C","浙江"],["D","天津"]],"answer":"B","explain":"通过AI知数搜索“2025年全国各省城镇居民人均可支配收入”，在结果页点击数据运算的按列计算最大值。"}],"links":[{"u":"file:///C:/Users/15275/Desktop/2026%E5%B9%B4%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E5%A4%A7%E8%B5%9B/2026%E5%B9%B4%E5%A4%A7%E5%AD%A6%E7%94%9F%E2%80%9DAI+%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E2%80%9C%E5%A4%A7%E8%B5%9B%E5%AE%A2%E8%A7%82%E9%A2%98%E5%91%BD%E9%A2%98%E8%8C%83%E5%9B%B4%E5%8F%8A%E5%A4%87%E8%B5%9B%E5%BB%BA%E8%AE%AE%EF%BC%882026.7.7%E5%8F%91%E5%B8%83%EF%BC%89/2026%E5%B9%B4%E5%A4%A7%E5%AD%A6%E7%94%9F%E2%80%9DAI+%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E2%80%9C%E5%A4%A7%E8%B5%9B%E5%AE%A2%E8%A7%82%E9%A2%98%E5%91%BD%E9%A2%98%E8%8C%83%E5%9B%B4%E5%8F%8A%E5%A4%87%E8%B5%9B%E5%BB%BA%E8%AE%AE%EF%BC%882026.7.8%E4%BF%AE%E8%AE%A2%EF%BC%89.docx#/pc/national/home","label":"https://data.stats.gov.cn/dg/website/page.html#/pc/national/home","host":"","access":"open","src":"page"},{"u":"https://www.escience.org.cn/data-center","label":"https://www.escience.org.cn/data-center","host":"www.escience.org.cn","access":"gov","src":"page"},{"u":"https://www.scidb.cn","label":"https://www.scidb.cn","host":"www.scidb.cn","access":"open","src":"page"},{"u":"https://data.worldbank.org/","label":"https://data.worldbank.org","host":"data.worldbank.org","access":"open","src":"page"},{"u":"https://mp.weixin.qq.com/s/uWR2BMvQtpuGkv9oXTZDdQ","label":"https://mp.weixin.qq.com/s/uWR2BMvQtpuGkv9oXTZDdQ","host":"mp.weixin.qq.com","access":"open","src":"page"},{"u":"https://data.stats.gov.cn/dg/website/page.html#/pc/national/home","label":"","host":"data.stats.gov.cn","access":"gov","src":"page"},{"u":"https://data.worldbank.org","label":"","host":"data.worldbank.org","access":"open","src":"page"}],"kw":["www.escience.org.cn","data.worldbank.org","data.stats.gov.cn","www.scidb.cn","data-center","ScienceDB","page.html","national","website","海南统计年鉴","https","CSTR","home","xlsx","DOI","GDP","csv","rdf"]},{"no":10,"id":"ecee954d-46a5-11f0-8ca6-b8599f11e190","title":"知识模块10：法律信息资源","use":"U3","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee954d-46a5-11f0-8ca6-b8599f11e190","req":["1.能够使用国家法律法规数据库（https://flk.npc.gov.cn）查询我国各层级法律法规，特别是高级检索功能。","2.能够使用国家行政法规库（http://www.gov.cn/zhengce/xzfgk/; http://xzfg.moj.gov.cn/search2.html）查找指定行政法规。","3.能够使用国家规章库（https://www.gov.cn/zhengce/xxgk/gjgzk/index.htm；https://www.moj.gov.cn/pub/sfbgw/gwygzk/index.html)查找指定规章。","4.能够使用人民法院案例库（https://rmfyalk.court.gov.cn）查询指定案例。","5.能够使用最高人民法院公报检索系统（http://gongbao.court.gov.cn）查询法院公报。","6.能够使用中国执行信息网（http://zxgk.court.gov.cn）查询被执行人、失信被执行人、限制消费人员和终本案件。","7.能够使用中国庭审公开网（http://tingshen.court.gov.cn）查庭审视频。","8.能够使用中国裁判文书网（https://wenshu.court.gov.cn）查询公开的判决书。","9. 能够使用中国法律知识资源总库（https://lawpro.cnki.net/）查询法学论文、司法案例和法律法规。"],"explore":["1. 根据学习要求中提供的网址，深度体验、探索，熟悉这些网站中的内容。","2. 探索：在中国法律知识资源总库检索哪些法律法规中出现了“人工智能”这个词，以及如何通过关键词、案由、案情、裁判文书查询类案，分析类案。","3. 探索：看哪个法律法规中出现了“共享单车”这个词？","4. 探索：涉及本校的判决书有哪些？必须要看到完整全文哦。","5. 探索：在中国执行信息网（http://zxgk.court.gov.cn）查询被执行人、失信被执行人、限制消费人员，看看“张三”这个名字是否能查得到？能否找到相关详情？"],"questions":[{"type":"单选题","stem":"星河互联集团有限公司被列为失信被执行人，请问立案时间为2018年10月31日的法律判决需偿还申请执行人多少金额？（ ）","options":[["A","87065"],["B","92245"],["C","88910"],["D","83640"]],"answer":"B","explain":"中国执行信息公开网中搜索星河互联集团有限公司，找到对应日期的案号为(2018)京0108执17244号，点开详情即可查看。"},{"type":"多选题","stem":"在中国法律知识资源总库中查找案例有哪些入口？","options":[["A","案例库"],["B","业务助手"],["C","类案推送"],["D","一框式检索"]],"answer":"ABCD","explain":"登录中国法律知识资源总库后，可在页面看到“案例”“业务助手”“一框式检索”入口；点击案例库之后，可进一步点击“类案推送”查询类案。所以ABCD都是正确答案。"}],"links":[{"u":"https://flk.npc.gov.cn/","label":"https://flk.npc.gov.cn","host":"flk.npc.gov.cn","access":"gov","src":"page"},{"u":"http://www.gov.cn/zhengce/xzfgk/","label":"http://www.gov.cn/zhengce/xzfgk/","host":"www.gov.cn","access":"gov","src":"page"},{"u":"http://xzfg.moj.gov.cn/search2.html","label":"http://xzfg.moj.gov.cn/search2.html","host":"xzfg.moj.gov.cn","access":"gov","src":"page"},{"u":"https://www.gov.cn/zhengce/xxgk/gjgzk/index.htm","label":"https://www.gov.cn/zhengce/xxgk/gjgzk/index.htm","host":"www.gov.cn","access":"gov","src":"page"},{"u":"https://www.moj.gov.cn/pub/sfbgw/gwygzk/index.html","label":"https://www.moj.gov.cn/pub/sfbgw/gwygzk/index.html","host":"www.moj.gov.cn","access":"gov","src":"page"},{"u":"https://rmfyalk.court.gov.cn/","label":"https://rmfyalk.court.gov.cn","host":"rmfyalk.court.gov.cn","access":"gov","src":"page"},{"u":"http://gongbao.court.gov.cn/","label":"http://gongbao.court.gov.cn","host":"gongbao.court.gov.cn","access":"gov","src":"page"},{"u":"http://zxgk.court.gov.cn/","label":"http://zxgk.court.gov.cn","host":"zxgk.court.gov.cn","access":"gov","src":"page"},{"u":"http://tingshen.court.gov.cn/","label":"http://tingshen.court.gov.cn","host":"tingshen.court.gov.cn","access":"gov","src":"page"},{"u":"https://wenshu.court.gov.cn/","label":"https://wenshu.court.gov.cn","host":"wenshu.court.gov.cn","access":"gov","src":"page"},{"u":"https://lawpro.cnki.net/","label":"https://lawpro.cnki.net","host":"lawpro.cnki.net","access":"login","src":"page"},{"u":"https://mp.weixin.qq.com/s?__biz=MzA4NTQ4MDkzNA==&mid=2654299012&idx=1&sn=6f7532e280f9a5bdc7012aa4360b9888&chksm=854b38ac89eca8be18ec44081bf02ea3c637b40ca5558c2379f711404eb14e922f8897cf32da&mpshare=1&scene=23&srcid=0612m8yC0d0RF2jEo 题","stem":"CHKD AI有一个功能可用于结构化临床问题，帮助医生精准定位证据、提升决策科学性，请问是哪一个？","options":[["A","机制研究"],["B","PICO 分析"],["C","疾病鉴别"],["D","基因分析"]],"answer":"B","explain":"在知识问答功能界面，【知识扩展】下的【PICO分析】可用于结构化临床问题。"}],"links":[{"u":"http://www.nhc.gov.cn/","label":"http://www.nhc.gov.cn","host":"www.nhc.gov.cn","access":"gov","src":"page"},{"u":"https://datasearch.nmpa.gov.cn/datasearch/home-index.html","label":"https://datasearch.nmpa.gov.cn/datasearch/home-index.html","host":"datasearch.nmpa.gov.cn","access":"gov","src":"page"},{"u":"https://chkd.cnki.net/ai/","label":"https://chkd.cnki.net/ai/","host":"chkd.cnki.net","access":"login","src":"page"},{"u":"https://mp.weixin.qq.com/s/f3h8pTh8o7vHrfNTvAq6bA","label":"https://mp.weixin.qq.com/s/f3h8pTh8o7vHrfNTvAq6bA","host":"mp.weixin.qq.com","access":"open","src":"page"},{"u":"http://www.nhc.gov.cn","label":"","host":"www.nhc.gov.cn","access":"gov","src":"page"}],"kw":["datasearch.nmpa.gov.cn","home-index.html","www.nhc.gov.cn","chkd.cnki.net","datasearch","https","CHKD","http"]},{"no":15,"id":"ecee930b-46a5-11f0-8ca6-b8599f11e190","title":"知识模块15：文教信息查询","use":"U4","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee930b-46a5-11f0-8ca6-b8599f11e190","req":["1.能够利用中国教育考试网（https://www.neea.edu.cn）查询包括大学英语四六级考试、全国计算机等级考试、中小学教师资格考试在内的多种考试信息。","2.能够通过研招网（https://yz.chsi.com.cn 查询研究生（硕士和博士）招生相关信息。","3.能够通过国家大学生就业服务平台（https://www.ncss.cn）及下属平台（高校毕业生到国际组织实习任职信息服务平台：https://gj.ncss.cn；全国大学生创业服务网：https://cy.ncss.cn）查找就业和创业信息。"],"explore":["1. 根据学习要求中提供的网址，进入相关网址，深度体验、探索，熟悉这些网站中的内容。","1. 探索：在研招网中查询哪个“双一流”建设高校有图书馆学专业的硕士点和博士点，并且接受退役大学生士兵专项计划考生报考？","2. 探索：在国家大学生就业服务平台找工作地点在杭州的小学教师的岗位。","3. 探索：在高校毕业生到国际组织实习任职信息服务平台中查询适合自己的职位。","4. 探索：在全国大学生创业服务网中找投资人。"],"questions":[{"type":"单选题","stem":"通过研招网查询可知，招天体物理专业硕士研究生并且接受退役大学生士兵专项计划考试报考的“双一流”建设高校是（ ）。","options":[["A","北京大学"],["B","中国科学院大学"],["C","天津师范大学"],["D","云南大学"]],"answer":"B","explain":"在研招网的硕士专业目录检索界面中输入专业名称“天体物理”，是否接收退役大学生士兵专项计划考生报考筛选条件选择“是”，找到检索结果，点击“开设院校”按钮，在检索结果中勾选“双一流”建设高校，可以看到答案。"}], p.com/books","label":"https://academic.oup.com/books","host":"academic.oup.com","access":"mixed","src":"page"},{"u":"https://www.ncbi.nlm.nih.gov/books/","label":"https://www.ncbi.nlm.nih.gov/books/","host":"www.ncbi.nlm.nih.gov","access":"open","src":"page"}],"kw":["Data Management for Social Scientists","www.ncbi.nlm.nih.gov","www.cambridge.org","academic.oup.com","Management","Scientists","bookshelf","Social","books","https","Data","NCBI","core","for"]},{"no":20,"id":"ecee9ffd-46a5-11f0-8ca6-b8599f11e190","title":"知识模块20：国家图书馆免费数字资源","use":"U8","legacy":"实用学习资源","detail":"https://csc.xxsuyang.com/detail?id=ecee9ffd-46a5-11f0-8ca6-b8599f11e190","req":["1.了解我国国家图书馆（http://www.nlc.cn）和美国国会图书馆（https://www.loc.gov）中的免费数字资源，进入各版块大致了解其包含内容。","2.能够从我国国家图书馆旗下的特色资源库中免费获取数字文献，尤其是其中的中华古籍资源库（http://read.nlc.cn/thematDataSearch/toGujiIndex）和民国时期文献库（http://read.nlc.cn/specialResourse/minguoIndex）。","3.掌握美国国会图书馆免费数字资源的获取方法，重点关注电子书、地图。"],"explore":[],"questions":[{"type":"判断题","stem":"在国家图书馆旗下的民国时期文献库中可以找到名为图书《代数难题详解》（俞树德编）并查看全文，“二 简易方程式”这一节在正文的第10页。","options":[],"answer":"正确","explain":"进入国家图书馆网站。在数字资源栏目下找到“民国时期文献”的链接并进入。搜索书名，找到“在线阅览”入口。"}],"links":[{"u":"http://www.nlc.cn","label":"http://www.nlc.cn","host":"www.nlc.cn","access":"open","src":"page"},{"u":"https://www.loc.gov","label":"https://www.loc.gov","host":"www.loc.gov","access":"open","src":"page"},{"u":"http://read.nlc.cn/thematDataSearch/toGujiIndex","label":"http://read.nlc.cn/thematDataSearch/toGujiIndex","host":"read.nlc.cn","access":"open","src":"page"},{"u":"http://read.nlc.cn/specialResourse/minguoIndex","label":"http://read.nlc.cn/specialResourse/minguoIndex","host":"read.nlc.cn","access":"open","src":"page"}],"kw":["thematDataSearch","specialResourse","minguoIndex","read.nlc.cn","toGujiIndex","www.loc.gov","www.nlc.cn","https","http"]},{"no":21,"id":"ecee7f97-46a5-11f0-8ca6-b8599f11e190","title":"知识模块21：期刊论文的检索","use":"U5","legacy":"学术信息资源","detail":"https://csc.xxsuyang.com/detail?id=ecee7f97-46a5-11f0-8ca6-b8599f11e190","req":["1.能够使用CNKI、万方、维普等中文学术数据库检索中文期刊论文。","2.能够使用LeapSpace、ScienceDirect、Wiley、Taylor&Francis、ACM、ASME等外文数据库检索外文期刊论文。","3.能够使用CNS（Nature、Cell、Science）三大国际顶级学术期刊的官网检索现刊和过刊论文。"],"explore":["5. 探索：《图书馆众筹研究》这篇论文在CNKI、万方、维普中都能找到吗？","6. 探索：《Determining and assessing characteristics of data element names impacting the performance of annotation using Usagi》这篇文章在ScienceDirect、Wiley、Taylor&Francis、ACM数据库中都能找到吗？","7. 探索：在Nature、Cell、Science的官网上查找2000年6月的过刊论文各1篇。"],"questions":[{"type":"单选题","stem":"在Taylor&Francis数据库中找到名为《Labour market mismatch among master’s graduates in the humanities from 1995 to 2015 in Norway》的论文。请问这篇论文PDF全文的页数与下列哪个数字最接近？（ ）","options":[["A","5"],["B","12"],["C","20"],["D","37"]],"answer":"C","explain":"在官网首页直接搜索，找到点击PDF图标即可打开全文。"}],"links":[{"u":"https://www.cnki.net/","label":"CNKI","host":"www.cnki.net","access":"login","src":"page"},{"u":"https://www.wanfangdata.com.cn/","label":"万方","host":"www.wanfangdata.com.cn","access":"login","src":"page"},{"u":"https://www.cqvip.com/","label":"维普","host":"www.cqvip.com","access":"login","src":"page"},{"u":"https://www.sciencedirect.com/leapspace","label":"LeapSpace","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://www.sciencedirect.com/","label":"ScienceDirect","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://onlinelibrary.wiley.com/","label":"Wiley","host":"onlinelibrary.wiley.com","access":"login","src":"page"},{"u":"https://www.tandfonline.com/","label":"Taylor&Francis","host":"www.tandfonline.com","access":"login","src":"page"},{"u":"https://dl.acm.org/","label":"ACM","host":"dl.acm.org","access":"login","src":"page"},{"u":"https://asmedigitalcollection.asme.org/","label":"ASME","host":"asmedigitalcollection.asme.org","access":"login","src":"page"},{"u":"https://www.nature.com/","label":"Nature","host":"www.nature.com","access":"mixed","src":"page"},{"u":"https://www.cell.com/","label":"Cell","host":"www.cell.com","access":"mixed","src":"page"},{"u":"https://www.science.org/journal/science","label":"Science","host":"www.science.org","access":"mixed","src":"page"}],"kw":["characteristics","Taylor&Francis","ScienceDirect","Determining","performance","annotation","LeapSpace","assessing","impacting","Science","element","图书馆众筹研究","Nature","Usagi","Wiley","names","using","ASME"]},{"no":22,"id":"ecee8139-46a5-11f0-8ca6-b8599f11e190","title":"知识模块22：学术会议论文及会议信息的检索","use":"U5","legacy":"学术信息资源","detail":"https://csc.xxsuyang.com/detail?id=ecee8139-46a5-11f0-8ca6-b8599f11e190","req":["1.能够根据需求查找会议及会议文献，并能从文献中获取想要的信息。","2.能从CNKI、万方、维普等数据库中检索会议论文。","3.能从IEEE官网查找IEEE会议信息。","4.能从CNKI中国学术会议网中查找学术会议信息。"],"explore":["2.探索：进入IEEE官网的会议栏目，动手查找“人工智能”方面的会议信息。","3.探索：从CNKI中国学术会议网中查找最近3个月的会议。","4.探索：《数字时代背景下体育教师教学推进路径研究》这篇会议论文，在CNKI、万方、维普都能找到吗？"],"questions":[{"type":"单选题","stem":"2026 IEEE IAS Petroleum and Chemical Industry Committee Technical Conference (PCIC)将于2026年9月在美国费城召开。这次会议的论文提交截止时间是（ ）。","options":[["A","2025年8月1日"],["B","2025年11月20日"],["C","2025年10月20日"],["D","2025年11月30日"]],"answer":"A","explain":"通过搜索引擎找到IEEE官网，在会议菜单中选择Upcoming conferences，搜索即可找到，查看详情。"}],"links":[{"u":"https://www.cnki.net/","label":"CNKI","host":"www.cnki.net","access":"login","src":"page"},{"u":"https://www.wanfangdata.com.cn/","label":"万方","host":"www.wanfangdata.com.cn","access":"login","src":"page"},{"u":"https://www.cqvip.com/","label":"维普","host":"www.cqvip.com","access":"login","src":"page"},{"u":"https://www.ieee.org/conferences/index.html","label":"IEEE","host":"www.ieee.org","access":"mixed","src":"page"},{"u":"https://conf.cnki.net/Home","label":"CNKI中国学术会议网","host":"conf.cnki.net","access":"login","src":"page"}],"kw":["数字时代背景下体育教师教学推进路径研究","CNKI","IEEE"]},{"no":23,"id":"ecee9701-46a5-11f0-8ca6-b8599f11e190","title":"知识模块23：学位论文及资源获取","use":"U5","legacy":"学术信息资源","detail":"https://csc.xxsuyang.com/detail?id=ecee9701-46a5-11f0-8ca6-b8599f11e190","req":["1.能够从CNKI、万方、维普等学位论文数据库中找到指定的信息。","2.能够从国家图书馆博士论文数据库中找到指定资源。","3.能够从MIT Theses中获取指定学位论文全文。"],"explore":["2.探索：国家图书馆博士论文数据库可以免费检索，检索标题中包含“大数据”的博士学位论文，结果有多少篇？","3.探索：MIT Theses可以获取大部分学位论文的全文，查找两篇题目中包含“education”的学位论文，获取全文。","4.探索：《 接纳承诺疗法对DR患者心理灵活性及负性情绪的干预研究》这篇硕士学位论文在CNKI、万方、维普都能找到吗？"],"questions":[{"type":"单选题","stem":"请问下列哪篇学位论文的指导老师不是西南交通大学的何川老师。（ ）","options":[["A","高地应力层状软岩隧道围岩变形机理与支护结构体系力学行为研究"],["B","高海拔寒区特长公路隧道冻胀特性及防冻研究"],["C","施工期盾构隧道管片结构受力特性及裂损现象分析"],["D","薄层破碎硬质岩隧道（群）施工方法及支护方式研究"]],"answer":"D","explain":"进入到CNKI学位论文数据库。找到这几篇学位论文。点开看详情，可以看到导师。"}],"links":[{"u":"https://www.cnki.net/","label":"CNKI","host":"www.cnki.net","access":"login","src":"page"},{"u":"https://www.wanfangdata.com.cn/","label":"万方","host":"www.wanfangdata.com.cn","access":"login","src":"page"},{"u":"https://www.cqvip.com/","label":"维普","host":"www.cqvip.com","access":"login","src":"page"},{"u":"http://read.nlc.cn/allSearch/searchList?searchType=65","label":"国家图书馆博士论文数据库","host":"read.nlc.cn","access":"open","src":"page"},{"u":"https://dspace.mit.edu/","label":"MIT Theses","host":"dspace.mit.edu","access":"open","src":"page"}],"kw":[" 接纳承诺疗法对DR患者心理灵活性及负性情绪的干预研究","education","Theses","CNKI","MIT"]},{"no":24,"id":"ecee8a51-46a5-11f0-8ca6-b8599f11e190","title":"知识模块24：OA、预印本及其他免费资源","use":"U5","legacy":"学术信息资源","detail":"https://csc.xxsuyang.com/detail?id=ecee8a51-46a5-11f0-8ca6-b8599f11e190","req":["1.了解Open Access、Open Archives和预印本","2.能够从OA信息资源检索系统DOAJ、OALIB等OA资源检索平台上找到指定的信息。","3.能够从arXiv、ChinaXiv、medRxiv 等预印本系统中找到指定信息。","4.能够从维普、LeapSpace、ScienceDirect、Wiley、Taylor&Francis、剑桥期刊数据库、牛津学术数据库、ACM、IOPscience、jstor、BioOne数字图书馆等数据库中找到OA文献资源并获取全文。","5.能够从抗日战争与近代中日关系文献数据平台、国家哲学社会科学文献中心获取免费文献。","6.能够通过报纸网站（数字报纸）找到指定报纸具体时间具体版面信息。"],"explore":["2. 探索：在LeapSpace中通过prompt提问获取10篇包含“AI”的OA论文。","3. 探索：在arXiv中找到一篇篇名中包含“education”和“big data”的论文全文。","4. 探索：在ScienceDirect中找一篇篇名中包含“AIGC”的OA论文并获取全文。"],"questions":[{"type":"单选题","stem":"请在arXiv中找到arXiv identifier为“2108.09800”的文献并打开全文。请问这篇PDF全文共有（ ）页。","options":[["A","9"],["B","14"],["C","18"],["D","23"]],"answer":"C","explain":"搜索找到并打开arX -8ca6-b8599f11e190","title":"知识模块49：数据可视化工具","use":"U10","legacy":"科研工具","detail":"https://csc.xxsuyang.com/detail?id=ecee9771-46a5-11f0-8ca6-b8599f11e190","req":["1、 熟悉ECharts（https://echarts.apache.org/zh/index.html）可视化图表库。","2、 能够使用常用AI工具结合ECharts生成包含JavaScript代码的HTML网页，呈现可视化图形。","3、 熟悉AI工具豆包的数据分析功能。","4、 能够使用微词云（https://www.weiciyun.com）统计长文本词频并生成词云图（非会员每日只能免费使用三次词频统计，请同学们在考试当天谨慎使用此功能！！！）。","5、 能够基于开放数据集平台获取的数据，使用 ECharts、EXCEL 图表或 AI 工具生成基础可视化图表，并能够判断图表类型与数据类型是否匹配。"],"explore":["2、探索：ECharts中有哪些图表，要能够找到，并且能看到代码和效果。","3、探索：基于excel中的数据，让AI结合echarts生成网页代码，生成炫酷图表。","4、探索：今年政府工作报告的高频动词，排名前十的是哪几个？用高频名词做一个点赞手势词云图。"],"questions":[{"type":"判断题","stem":"在微词云（ https://www.weiciyun.com ）中统计2021年总理所做的政府工作报告。可以发现，“经济”这个词出现的次数高于“发展”。（ ）","options":[],"answer":"错误","explain":"先找到2021年的政府工作报告，全文复制。在微词云网站上选择“在线分词”，粘贴复制的文本，然后下一步。微信扫码关注后即可看到结果。“发展”的词频高于“经济”。"}],"links":[{"u":"https://echarts.apache.org/zh/index.html","label":"https://echarts.apache.org/zh/index.html","host":"echarts.apache.org","access":"open","src":"page"},{"u":"https://www.weiciyun.com/","label":"https://www.weiciyun.com","host":"www.weiciyun.com","access":"open","src":"page"},{"u":"https://www.weiciyun.com","label":"","host":"www.weiciyun.com","access":"open","src":"page"}],"kw":["echarts.apache.org","www.weiciyun.com","JavaScript","index.html","ECharts","echarts","EXCEL","excel","https","HTML"]},{"no":50,"id":"ecee973e-46a5-11f0-8ca6-b8599f11e190","title":"知识模块50：文献可视化工具","use":"U10","legacy":"科研工具","detail":"https://csc.xxsuyang.com/detail?id=ecee973e-46a5-11f0-8ca6-b8599f11e190","req":["1. 了解文献可视化（知识图谱）工具，如CiteSpace、VOSViewer等。","2. 熟练掌握赛特新思（https://www.citexs.com/Paperpicky）的文献调研分析功能。","3. 熟练掌握CNKI及CNKI AI(ai.cnki.net)、万方数据知识服务平台、维普中文期刊服务平台的文献可视化分析功能。"],"explore":["5. 探索：在赛特新思的文献调研分析功能界面中，学科选择“医学”，关键词输入“大数据”，可视化图形中圆圈最大的文献是哪一篇？","6. 探索：2020—2025年西安交通大学发表CSSCI论文数量排名前5的作者依次是？","7. 探索：在CNKI AI文献计量分析功能界面，输入研究方向，了解近十年发文趋势"],"questions":[{"type":"单选题","stem":"请问2011年至2020年间以“四川师范大学”为第一作者单位发表CSSCI论文最多的作者是（ ）。","options":[["A","谭光辉"],["B","汪洪亮"],["C","唐代兴"],["D","蔡方鹿"]],"answer":"C","explain":"CSSCI论文，一般在中文期刊论文数据库中检索，其中比较常用的是CNKI、维普、万方。在这三个数据库中，只有CNKI有“第一单位”（第一作者单位）这个检索点。所以选择CNKI。在CNKI的高级检索界面，文献类型选择“学术期刊”，检索点选择“第一单位”，检索词输入“四川师范大学”，匹配方式选择默认的“模糊”，时间限制2011-2020，来源期刊勾选“CSSCI”，然后点击“检索”。在检索结果页面，选择“导出与分析”→“可视化分析”→“全部检索结果分析”，在分析结果页面，选择“中国作者分布”项，即可看到高频作者排序柱状图。"}],"links":[{"u":"https://www.citexs.com/Paperpicky","label":"https://www.citexs.com/Paperpicky","host":"www.citexs.com","access":"open","src":"page"},{"u":"https://ai.cnki.net/chat/home","label":"ai.cnki.net","host":"ai.cnki.net","access":"login","src":"page"}],"kw":["www.citexs.com","ai.cnki.net","Paperpicky","CiteSpace","VOSViewer","CSSCI","https","CNKI"]}],"platforms":[{"host":"conf.cnki.net","name":"CNKI 中国学术会议网","url":"https://conf.cnki.net/Home","urls":["https://conf.cnki.net/Home"],"mods":["知识模块22：学术会议论文及会议信息的检索"],"access":"login","src":"page","cat":"C01","disc":["D0"],"note":"关联：模块22：学术会议论文及会议信息的检索"},{"host":"navi.cnki.net","name":"CNKI 期刊导航","url":"https://navi.cnki.net/knavi/RSS/STEU","urls":["https://navi.cnki.net/knavi/RSS/STUD","https://navi.cnki.net/knavi/RSS/RST","https://navi.cnki.net/knavi/RSS/STYU","https://navi.cnki.net/knavi/RSS/STEU"],"mods":["知识模块47：文献追踪工具"],"access":"login","src":"page","cat":"C01","disc":["D0"],"note":"关联：模块47：文献追踪工具"},{"host":"www.wanfangdata.com.cn","name":"万方数据知识服务平台","url":"https://www.wanfangdata.com.cn","urls":["https://www.wanfangdata.com.cn/","https://www.wanfangdata.com.cn"],"mods":["知识模块11：标准与商标信息资源","知识模块12：专利和地理标志","知识模块21：期刊论文的检索","知识模块22：学术会议论文及会议信息的检索","知识模块23：学位论文及资源获取","知识模块31：高级检索","知识模块32：布尔逻辑检索","知识模块35：结果筛选"],"access":"login","src":"page","cat":"C01","disc":["D0"],"note":"关联：模块11：标准与商标信息资源；模块12：专利和地理标志"},{"host":"www.cnki.net","name":"中国知网 CNKI","url":"https://www.cnki.net/","urls":["http://www.cnki.net/","https://www.cnki.net/"],"mods":["知识模块11：标准与商标信息资源","知识模块12：专利和地理标志","知识模块21：期刊论文的检索","知识模块22：学术会议论文及会议信息的检索","知识模块23：学位论文及资源获取","知识模块31：高级检索","知识模块32：布尔逻辑检索","知识模块3 const MODS = DATA.modules, USES = DATA.uses, PLATS = DATA.platforms;
const CATS = DATA.cats || [], DISCS = DATA.discs || [], FLOW = DATA.flow || [];
const byNo = {}; MODS.forEach(m => byNo[m.no] = m);
const byUse = {}; USES.forEach(u => byUse[u.id] = u);
const CATNAME = {}; CATS.forEach(c => CATNAME[c.id] = c.name);
const DISCNAME = {}; DISCS.forEach(d => DISCNAME[d.id] = d.name);

// lowercased search blobs
MODS.forEach(m => {
  m._blob = [m.title, m.legacy, m.use, (u => u.name)(byUse[m.use] || {name:''}),
    m.kw.join(' '), m.req.join(' '), m.explore.join(' '),
    m.questions.map(q => q.stem + ' ' + q.options.map(o => o.join('')).join(' ') + ' ' + q.answer + ' ' + q.explain).join(' '),
    m.links.map(l => l.label + ' ' + l.u + ' ' + l.host).join(' ')
  ].join(' ').toLowerCase();
});
PLATS.forEach(p => {
  p._blob = (p.name + ' ' + p.host + ' ' + p.urls.join(' ') + ' ' + p.mods.join(' ')
    + ' ' + (CATNAME[p.cat] || '') + ' ' + (p.disc || []).map(d => DISCNAME[d] || '').join(' ')
    + ' ' + (p.note || '')).toLowerCase();
});
FLOW.forEach(f => {
  f._blob = (f.name + ' ' + f.goal + ' ' + f.tips.join(' ') + ' ' + f.pitfall + ' '
    + f.tools.map(t => t.name + ' ' + (t.note || '')).join(' ')).toLowerCase();
});

/* ---------- 状态：优先 localStorage，其次 URL hash ----------
   某些环境（App 内置浏览器 / 沙箱预览）每次打开都会清空 origin 存储，
   因此把状态同时写进 URL hash，任何情况下都能靠链接本身恢复。 */
const HKEY = 'csc-qref-v2';
function loadState() {
  let st = {};
  try { st = JSON.parse(localStorage.getItem(HKEY) || '{}') || {}; } catch (e) { st = {}; }
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('m')) st.sel = +h.get('m');
  if (h.get('t')) st.openMode = h.get('t');
  return st;
}
function saveState() {
  const st = { sel: S.sel, openMode: S.openMode };
  try { localStorage.setItem(HKEY, JSON.stringify(st)); } catch (e) {}
  try {
    const q = 'm=' + st.sel + '&t=' + st.openMode;
    history.replaceState(null, '', location.pathname + location.search + '#' + q);
  } catch (e) {}
}

const _init = loadState();
const S = { sel: _init.sel && byNo[_init.sel] ? _init.sel : MODS[0].no,
            openMode: _init.openMode === 'same' ? 'same' : 'tab',
            nav: 'toc', li: -1, res: [], ri: 0, platList: [], pi: 0, openUse: {},
            cat: '', disc: '', ptab: 'catalog' };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TAGS = { login:'需登录', mixed:'部分免费', gov:'公共机构', open:'公开' };

/* ---------- TOC ---------- */
function renderTOC() {
  let h = '';
  USES.forEach((u, i) => {
    const key = i < 9 ? 'Alt+' + (i + 1) : 'Alt+0';
    const open = S.openUse[u.id] !== false;
    var mods = MODS.filter(m => m.use === u.id);
    h += '<div class="use' + (open ? ' open' : '') + '" data-use="' + u.id + '">';
    h += '<div class="use-head" data-toggle="' + u.id + '"><kbd>' + key + '</kbd>'
       + '<span>' + esc(u.name) + '</span><span class="cnt">' + mods.length + ' 模块</span></div>';
    h += '<div class="mods">';
    mods.forEach((m, j) => {
      h += '<div class="mod' + (m.no === S.sel ? ' sel' : '') + '" data-no="' + m.no + '">'
         + '<span class="idx">' + u.id + '-' + (j + 1) + '</span>'
         + '<span>' + String(m.no).padStart(2, '0') + ' ' + esc(m.title.replace(/^知识模块\d+：/, '')) + '</span></div>';
    });
    h += '</div></div>';
  });
  $('side').innerHTML = h;
  $('side').querySelectorAll('.use-head').forEach(e => e.onclick = () => {
    const id = e.dataset.toggle; S.openUse[id] = S.openUse[id] === false; renderTOC();
  });
  $('side').querySelectorAll('.mod').forEach(e => e.onclick = () => selectMod(+e.dataset.no, true));
}

function jumpUse(i) {
  const u = USES[i]; if (!u) return;
  S.openUse[u.id] = true;
  const first = MODS.find(m => m.use === u.id);
  if (first) selectMod(first.no, false);
  renderTOC();
  const el = $('side').querySelector('.use[data-use="' + u.id + '"]');
  if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  S.nav = 'toc';
}

/* ---------- detail ---------- */
function selectMod(no, scrollTOC) {
  S.sel = no; S.li = -1;
  const m = byNo[no]; if (!m) return;
  saveState();
  const u = byUse[m.use] || { name: '' };
  let h = '<h1>' + esc(m.title) + '</h1>';
  h += '<div class="crumb">用途 <b>' + u.id + ' · ' + esc(u.name) + '</b>　|　'
     + '原分类 ' + esc(m.legacy) + '　|　索引 <b>' + u.id + '-' + (u.nos.indexOf(m.no) + 1) + '</b>　|　'
     + m.links.length + ' 个资源　|　' + m.questions.length + ' 道例题</div>';
  h += '<div class="actions">'
     + '<a href="' + m.detail + '" target="_blank" rel="noopener">打开原始页面 <kbd>o</kbd></a>'
     + '<button data-copy="' + m.detail + '">复制原页链接 <kbd>y</kbd></button>'
     + '<button data-jump="' + u.id + '">回到目录 <kbd>[</kbd></button>'
     + '</div>';

  if (m.req.length) {
    h += '<section><h2>📌 学习要点（官方“具体要求”）</h2><ul class="req">'
       + m.req.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></section>';
  }
  if (m.kw.length) {
    h += '<section><h2>🔑 关键词</h2><div>'
       + m.kw.map(k => '<span class="badge">' + esc(k) + '</span>').join(' ') + '</div></section>';
  }
  if (m.explore.length) {
    h += '<section><h2>🧭 实践任务（探索建议）</h2><ul class="req">'
       + m.explore.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></section>';
  }
  if (m.links.length) {
    h += '<section><h2>🔗 资源链接 —— 按数字键直接打开</h2>';
    h += '<div class="hint">数字键 <kbd>1</kbd>…<kbd>9</kbd> <kbd>0</kbd> 打开前 10 个；'
       + '按 <kbd>l</kbd> 进入链接导航模式后用 <kbd>↑</kbd><kbd>↓</kbd> 选择、<kbd>Enter</kbd> 打开。'
       + '若打开时总弹出“即将访问外部链接”确认框，按 <kbd>t</kbd> 切换为“当前标签页”方式。</div>';
    h += '<ol class="links">';
    m.links.forEach((l, i) => {
      const k = i < 9 ? String(i + 1) : (i === 9 ? '0' : '');
      let host = l.host.replace(/^www\./, '');
      h += '<li data-li="' + i + '">' + (k ? '<kbd>' + k + '</kbd>' : '<kbd>·</kbd>')
         + '<span class="lk"><a href="' + esc(l.u) + '" target="_blank" rel="noopener" class="lab">'
         + esc(l.label || host) + '</a><br><span class="u">' + esc(l.u.length > 110 ? l.u.slice(0, 110) + '…' : l.u)
         + '</span></span>'
         + '<span class="tag ' + l.access + '">' + (TAGS[l.access] || '') + '</span></li>';
    });
    h += '</ol></section>';
  } else {
    h += '<section><h2>🔗 资源链接</h2><div class="hint">该模块页面未给出独立链接，学习要点以官方“具体要求”为准；'
       + '可在搜索框输入平台名直接打开（如 <kbd>Kimi</kbd>、<kbd>知网</kbd>）。</div></section>';
  }
  m.questions.forEach((q, qi) => {
    h += '<section><h2>📝 例题 ' + (qi + 1) + '</h2><div class="q">';
    if (q.type) h += '<div class="qtype">' + esc(q.type) + '</div>';
    h += '<div class="stem">' + esc(q.stem) + '</div>';
    if (q.options.length) h += '<ul class="opts">' + q.options.map(o => '<li>' + esc(o[0]) + '、' + esc(o[1]) + '</li>').join('') + '</ul>';
    if (q.answer) h += '<div class="ans">正确答案：' + esc(q.answer) + '</div>';
    if (q.explain) h += '<div class="exp">' + esc(q.explain) + '</div>';
    h += '</div></section>';
  });

  $('detail').innerHTML = h;
  $('detail').scrollTop = 0;
  $('detail').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  $('detail').querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const i = USES.findIndex(x => x.id === b.dataset.jump); jumpUse(i);
  });
  if (scrollTOC) {
    $('side').querySelectorAll('.mod').forEach(e => e.classList.toggle('sel', +e.dataset.no === no));
    const el = $('side').querySelector('.mod.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
}

function copy(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => legacyCopy(t));
  } else { legacyCopy(t); }
  toast('已复制链接：' + t, t);
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) {}
}

/* ------------------------------------------------------------------
   打开网址：绝不使用 window.open()
   根因：window.open(url,'_blank','noopener') 带 features 参数，会被
   浏览器/WebView 判定为“弹出窗口(popup)”请求并拦截；被拦截时宿主
   环境会弹出“即将访问外部链接…”确认框。鼠标直接点 <a target=_blank>
   走的是普通链接导航，不经过 popup 判定，所以不会弹框。
   修复：改为激活一个真实 <a> 元素，让键盘操作与鼠标点击走同一条路径。
------------------------------------------------------------------ */
let _opener = null;
function openerAnchor() {
  if (!_opener) {
    _opener = document.createElement('a');
    _opener.style.display = 'none';
    _opener.rel = 'noopener noreferrer';
    document.body.appendChild(_opener);
  }
  return _opener;
}

function openURL(u) {
  if (!u) return;
  if (S.openMode === 'same') {                       // 当前标签页：普通导航
    try { location.assign(u); } catch (e) { location.href = u; }
    return;
  }
  const a = openerAnchor();                          // 新标签页：真实链接点击
  a.href = u;
  a.target = '_blank';
  a.click();
  toast('已在新标签页打开：' + u, u);
}

function openLink(i) {
  const m = byNo[S.sel]; const l = m && m.links[i];
  if (!l) return;
  openURL(l.u);
  const el = $('detail').querySelector('li[data-li="' + i + '"]');
  if (el) { el.classList.add('hot'); setTimeout(() => el.classList.remove('hot'), 700); }
}

/* 轻提示：即使被环境拦截，用户也能看到地址并手动复制 */
let _toastT = null;
function toast(msg, url) {
  const t = $('toast');
  t.innerHTML = '<span class="tmsg">' + esc(msg) + '</span>'
    + '<button class="tcopy" type="button">复制链接</button>'
    + '<button class="tclose" type="button">×</button>';
  t.classList.add('on');
  const btn = t.querySelector('.tcopy');
  if (btn) btn.onclick = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(() => legacyCopy(url));
    else legacyCopy(url);
    btn.textContent = '已复制 ✓';
  };
  const cl = t.querySelector('.tclose');
  if (cl) cl.onclick = () => t.classList.remove('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), 6000);
}

/* ---------- search ---------- */
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) { S.res = []; renderResults(); return; }
  const parts = q.split(/\s+/);
  const hit = s => parts.every(p => s.includes(p));
  const out = [];
  PLATS.forEach(p => { if (hit(p._blob)) out.push({ t: 'url', name: p.name, sub: p.host, url: p.url, score: p.name.toLowerCase().includes(q) ? 0 : 1 }); });
  MODS.forEach(m => { if (hit(m._blob)) out.push({ t: 'mod', name: m.title, sub: (byUse[m.use] || {}).name, no: m.no, score: m.title.toLowerCase().includes(q) ? 0 : 1 }); });
  FLOW.forEach(f => { if (hit(f._blob)) out.push({ t: 'flow', name: '科研流程 · ' + f.name, sub: f.goal, stage: f.id, score: f.name.toLowerCase().includes(q) ? 0 : 2 }); });
  out.sort((a, b) => a.score - b.score);
  S.res = out.slice(0, 60); S.ri = 0;
  renderResults();
}

function renderResults() {
  const box = $('results');
  if (!S.res.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = S.res.map((r, i) =>
    '<div class="r' + (i === S.ri ? ' hot' : '') + '" data-i="' + i + '">'
    + '<span class="badge ' + (r.t === 'url' ? 'url' : (r.t === 'flow' ? 'flow' : 'mod')) + '">'
    + (r.t === 'url' ? '网址' : (r.t === 'flow' ? '流程' : '模块')) + '</span>'
    + '<span class="t">' + esc(r.name) + '</span>'
    + (r.t === 'url' ? '<span class="u">' + esc(r.sub) + '</span>' : '')
    + '<span class="s">' + esc(r.sub || '') + (r.t === 'mod' ? ' <kbd>Enter</kbd>' : ' <kbd>Enter</kbd> ↗') + '</span></div>'
  ).join('');
  box.classList.add('on');
  box.querySelectorAll('.r').forEach(e => {
    // 只切换高亮类，不重建 DOM —— 否则鼠标掠过会重置滚动位置
    e.onmouseenter = () => { S.ri = +e.dataset.i; hot(box, '.r', S.ri); };
    e.onclick = () => activateResult(+e.dataset.i);
  });
}

function hot(box, sel, i) {
  box.querySelectorAll(sel).forEach(e => e.classList.toggle('hot', +e.dataset.i === i));
}

function activateResult(i) {
  const r = S.res[i]; if (!r) return;
  if (r.t === 'url') { openURL(r.url); }
  else if (r.t === 'flow') { jumpFlow(r.stage); }
  else { selectMod(r.no, true); }
  $('q').value = ''; S.res = []; renderResults(); $('q').blur();
}

/* ---------- 科研资源地图：资源目录 ---------- */
function platChip(kind, id, name, n, on) {
  return '<button class="chip' + (on ? ' on' : '') + '" data-' + kind + '="' + esc(id) + '">'
    + esc(name) + '<span class="n">' + n + '</span></button>';
}
function renderChips() {
  const q = ($('platq').value || '').trim().toLowerCase();
  const parts = q.split(/\s+/).filter(Boolean);
  const base = PLATS.filter(p => parts.every(x => p._blob.includes(x)));
  const catN = {}, discN = {};
  base.forEach(p => {
    catN[p.cat] = (catN[p.cat] || 0) + 1;
    (p.disc || []).forEach(d => discN[d] = (discN[d] || 0) + 1);
  });
  $('catchips').innerHTML = platChip('cat', '', '全部类别', base.length, !S.cat)
    + CATS.map(c => platChip('cat', c.id, c.name, catN[c.id] || 0, S.cat === c.id)).join('');
  $('discchips').innerHTML = platChip('disc', '', '全部学科', base.length, !S.disc)
    + DISCS.map(d => platChip('disc', d.id, d.name, discN[d.id] || 0, S.disc === d.id)).join('');
  $('catchips').querySelectorAll('.chip').forEach(e => e.onclick = () => {
    S.cat = e.dataset.cat || ''; renderPlats();
  });
  $('discchips').querySelectorAll('.chip').forEach(e => e.onclick = () => {
    S.disc = e.dataset.disc || ''; renderPlats();
  });
}

function renderPlats() {
  const q = ($('platq').value || '').trim().toLowerCase();
  const parts = q.split(/\s+/).filter(Boolean);
  const list = PLATS.filter(p => (S.cat ? p.cat === S.cat : true)
    && (S.disc ? (p.disc || []).includes(S.disc) : true)
    && parts.every(x => p._blob.includes(x)));
  S.platList = list; S.pi = 0;
  renderChips();
  const box = $('platlist');
  if (!list.length) {
    box.innerHTML = '<div class="hint">没有匹配的平台</div>';
  } else {
    let h = '', last = '';
    list.forEach((p, i) => {
      if (!S.cat && p.cat !== last) {
        last = p.cat;
        const c = CATS.find(x => x.id === p.cat) || { name: p.cat, count: 0 };
        h += '<div class="grp">' + esc(c.name) + '<small>' + c.count + ' 个</small></div>';
      }
      const k = i < 9 ? String(i + 1) : (i === 9 ? '0' : '·');
      h += '<div class="plat" data-i="' + i + '">'
        + '<kbd>' + k + '</kbd><span class="nm">' + esc(p.name) + '</span>'
        + '<span class="hs">' + esc(p.host) + '</span>'
        + (p.note ? '<span class="note">' + esc(p.note) + '</span>' : '')
        + (p.src === 'catalog' ? '<span class="tag mixed">新增</span>' : '')
        + '<span class="cat">' + esc(CATNAME[p.cat] || '') + '</span>'
        + '<span class="tag ' + p.access + '">' + (TAGS[p.access] || '') + '</span></div>';
    });
    box.innerHTML = h;
  }
  $('platcount').textContent = (parts.length || S.cat || S.disc)
    ? '匹配 ' + list.length + ' / ' + PLATS.length + ' 个平台'
    : '共 ' + PLATS.length + ' 个平台 · ' + CATS.length + ' 类 · ' + DISCS.length + ' 个学科（按类别分组）';
  box.querySelectorAll('.plat').forEach(e => {
    e.onmouseenter = () => { S.pi = +e.dataset.i; hot(box, '.plat', S.pi); };
    e.onclick = () => openPlat(+e.dataset.i);
  });
}
function openPlat(i) { const p = S.platList[i]; if (p) openURL(p.url); }

/* ---------- 科研资源地图：科研流程 ---------- */
function renderFlow() {
  $('flowcount').textContent = FLOW.length;
  $('flowlist').innerHTML = FLOW.map((f, i) =>
    '<div class="flowstage" id="flow-' + f.id + '"><h4>' + (i + 1) + '. ' + esc(f.name) + '</h4>'
    + '<div class="goal">' + esc(f.goal) + '</div>'
    + '<ul class="tips">' + f.tips.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>'
    + '<div class="pit">常见坑：' + esc(f.pitfall) + '</div>'
    + '<div class="ftools">' + f.tools.map(t =>
        '<button class="ftool" data-url="' + esc(t.url) + '">' + esc(t.name) + '</button>').join('')
    + '</div></div>'
  ).join('');
  $('flowlist').querySelectorAll('.ftool').forEach(e => e.onclick = () => openURL(e.dataset.url));
}

function setPTab(tab) {
  S.ptab = tab === 'flow' ? 'flow' : 'catalog';
  $('catalogView').style.display = S.ptab === 'catalog' ? '' : 'none';
  $('flowView').style.display = S.ptab === 'flow' ? '' : 'none';
  document.querySelectorAll('.ptab').forEach(e => e.classList.toggle('on', e.dataset.ptab === S.ptab));
  if (S.ptab === 'flow') renderFlow(); else renderPlats();
}
function openMap(tab) {
  $('mask-plat').classList.add('on');
  if (tab !== 'flow') { S.cat = ''; S.disc = ''; }
  setPTab(tab);
  if (S.ptab === 'catalog') { $('platq').value = ''; renderPlats(); $('platq').focus(); }
}
function jumpFlow(id) {
  openMap('flow');
  setTimeout(() => { const el = $('flow-' + id); if (el) el.scrollIntoView({ block: 'start' }); }, 30);
}

/* ---------- help ---------- */
function renderHelp() {
  const K = s => '<kbd>' + esc(s) + '</kbd>';
  const rows = [
    ['g', '导航'],
    ['<kbd>?</kbd>', '显示 / 关闭本帮助'],
    ['<kbd>/</kbd> 或 <kbd>Ctrl</kbd>+<kbd>K</kbd>', '聚焦搜索框'],
    ['<kbd>Esc</kbd>', '清空搜索 / 关闭浮层'],
    ['<kbd>Alt</kbd>+<kbd>1</kbd> … <kbd>Alt</kbd>+<kbd>9</kbd>、<kbd>Alt</kbd>+<kbd>0</kbd>',
     '直达第 1–10 个用途分类'],
    ['<kbd>[</kbd> <kbd>]</kbd>', '上一个 / 下一个用途分类'],
    ['<kbd>↑</kbd> <kbd>↓</kbd> 或 ' + K('k') + ' ' + K('j'), '在模块目录中上下移动'],
    ['<kbd>Enter</kbd>', '打开选中的模块'],
    ['g', '网址'],
    ['<kbd>1</kbd> … <kbd>9</kbd> <kbd>0</kbd>', '打开当前模块的第 1–10 个资源链接（新标签页）'],
    ['<kbd>l</kbd>', '进入链接导航模式，' + K('↑') + K('↓') + ' 选链接、' + K('Enter') + ' 打开（第 11 个之后的链接）'],
    ['<kbd>p</kbd>', '打开 / 关闭「科研资源地图 · 资源目录」（' + DATA.meta.platforms + ' 个平台，' + (DATA.meta.categories || 0) + ' 类 / ' + (DATA.meta.disciplines || 0) + ' 学科）'],
    ['<kbd>w</kbd>', '打开「科研流程」：选题 → 检索 → 管理 → 数据 → 分析 → 写作 → 投稿 → 传播（' + (DATA.meta.flow || 0) + ' 幕）'],
    ['<kbd>t</kbd>', '切换网址打开方式：<b>新标签页 ↔ 当前标签页</b>（被环境拦截时改用当前标签页）'],
    ['<kbd>o</kbd>', '在新标签页打开当前模块的官网原页'],
    ['<kbd>y</kbd>', '复制当前模块的官网链接'],
    ['g', '搜索'],
    ['直接输入关键词', '同时搜模块标题、学习要点、关键词、平台、网址'],
    ['<kbd>↑</kbd> <kbd>↓</kbd>', '在搜索结果中切换'],
    ['<kbd>Enter</kbd>', '激活：模块 → 跳转；网址 → 打开'],
    ['资源地图内', '输入即过滤；点类别 / 学科筛选；<kbd>1</kbd>…<kbd>0</kbd> 直接打开前 10 个结果'],
    ['科研流程内', '点击工具名直接打开；也可在顶部搜索框搜“投稿”“查重”“预印本”等'],
  ];
  $('helpbody').innerHTML = '<div class="kbdgrid">' + rows.map(r => {
    if (r[0] === 'g') return '<div class="kgroup">' + r[1] + '</div>';
    return '<div class="k">' + r[0] + '</div><div class="d">' + r[1] + '</div>';
  }).join('') + '</div>';
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  const platOpen = $('mask-plat').classList.contains('on');
  const helpOpen = $('mask-help').classList.contains('on');

  if (e.key === 'Escape') {
    if (helpOpen) { $('mask-help').classList.remove('on'); return; }
    if (platOpen) { $('mask-plat').classList.remove('on'); return; }
    if ($('results').classList.contains('on')) { S.res = []; renderResults(); $('q').value = ''; $('q').blur(); return; }
    return;
  }
  if (e.key === '?' && !typing) { e.preventDefault(); $('mask-help').classList.toggle('on'); return; }
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }

  if (helpOpen) return;

  // 科研资源地图（资源目录 / 科研流程）
  if (platOpen) {
    if (!typing && (e.key === 'p' || e.key === 'P')) {
      e.preventDefault();
      if (S.ptab === 'catalog') $('mask-plat').classList.remove('on');
      else setPTab('catalog');
      return;
    }
    if (!typing && (e.key === 'w' || e.key === 'W')) {
      e.preventDefault();
      if (S.ptab === 'flow') $('mask-plat').classList.remove('on');
      else setPTab('flow');
      return;
    }
    if (S.ptab !== 'catalog') return;
    if ((/^[0-9]$/.test(e.key) && e.target !== $('platq')) || (e.altKey && /^[0-9]$/.test(e.key))) {
      const n = e.key === '0' ? 10 : +e.key; openPlat(n - 1); e.preventDefault(); return;
    }
    if (e.key === 'ArrowDown') { S.pi = Math.min(S.pi + 1, S.platList.length - 1); renderPlats(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { S.pi = Math.max(S.pi - 1, 0); renderPlats(); e.preventDefault(); return; }
    if (e.key === 'Enter') { openPlat(S.pi); e.preventDefault(); return; }
    return;
  }

  // search results
  if ($('results').classList.contains('on') && e.target === $('q')) {
    if (e.key === 'ArrowDown') { S.ri = Math.min(S.ri + 1, S.res.length - 1); renderResults(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { S.ri = Math.max(S.ri - 1, 0); renderResults(); e.preventDefault(); return; }
    if (e.key === 'Enter') { activateResult(S.ri); e.preventDefault(); return; }
  }

  if (e.altKey && /^[0-9]$/.test(e.key)) {
    const n = e.key === '0' ? 10 : +e.key; jumpUse(n - 1); e.preventDefault(); return;
  }
  if (typing) return;

  const cur = USES.findIndex(u => u.nos.includes(S.sel));
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    if ($('mask-plat').classList.contains('on') && S.ptab === 'catalog') $('mask-plat').classList.remove('on');
    else openMap('catalog');
    return;
  }
  if (e.key === 'w' || e.key === 'W') {
    e.preventDefault();
    if ($('mask-plat').classList.contains('on') && S.ptab === 'flow') $('mask-plat').classList.remove('on');
    else openMap('flow');
    return;
  }
  if (e.key === '[') { jumpUse((cur - 1 + USES.length) % USES.length); return; }
  if (e.key === ']') { jumpUse((cur + 1) % USES.length); return; }
  if (e.key === 'o' || e.key === 'O') { openURL(byNo[S.sel].detail); return; }
  if (e.key === 't' || e.key === 'T') { setMode(S.openMode === 'tab' ? 'same' : 'tab'); return; }
  if (e.key === 'y' || e.key === 'Y') { copy(byNo[S.sel].detail); return; }
  if (e.key === 'l' || e.key === 'L') { S.nav = (S.nav === 'links' ? 'toc' : 'links'); S.li = 0; hi(); return; }

  if (S.nav === 'links') {
    const n = byNo[S.sel].links.length;
    if (e.key === 'ArrowDown' || e.key === 'j') { S.li = Math.min(S.li + 1, n - 1); hi(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp' || e.key === 'k') { S.li = Math.max(S.li - 1, 0); hi(); e.preventDefault(); return; }
    if (e.key === 'Enter') { openLink(S.li); e.preventDefault(); return; }
  }

  if (/^[0-9]$/.test(e.key)) { openLink(e.key === '0' ? 9 : (+e.key - 1)); e.preventDefault(); return; }

  // module navigation
  const all = MODS.map(m => m.no);
  const i = all.indexOf(S.sel);
  if (e.key === 'ArrowDown' || e.key === 'j') { selectMod(all[Math.min(i + 1, all.length - 1)], true); e.preventDefault(); return; }
  if (e.key === 'ArrowUp' || e.key === 'k') { selectMod(all[Math.max(i - 1, 0)], true); e.preventDefault(); return; }
  if (e.key === 'Enter') { selectMod(S.sel, true); e.preventDefault(); return; }
});

function hi() {
  const m = byNo[S.sel];
  $('detail').querySelectorAll('li[data-li]').forEach(e =>
    e.classList.toggle('hot', +e.dataset.li === S.li));
  const el = $('detail').querySelector('li[data-li="' + S.li + '"]');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ---------- 打开方式 ---------- */
function setMode(m) {
  S.openMode = (m === 'same') ? 'same' : 'tab';
  const b = $('btn-mode');
  b.innerHTML = (S.openMode === 'same' ? '打开方式：当前标签页' : '打开方式：新标签页') + ' <kbd>t</kbd>';
  b.classList.toggle('same', S.openMode === 'same');
  saveState();
}

/* ---------- boot ---------- */
$('q').addEventListener('input', e => search(e.target.value));
$('q').addEventListener('focus', e => { if (e.target.value) search(e.target.value); });
$('platq').addEventListener('input', renderPlats);
$('btn-help').onclick = () => $('mask-help').classList.toggle('on');
$('btn-plat').onclick = () => openMap('catalog');
$('btn-flow').onclick = () => openMap('flow');
$('btn-mode').onclick = () => setMode(S.openMode === 'tab' ? 'same' : 'tab');
document.querySelectorAll('.ptab').forEach(e => e.onclick = () => setPTab(e.dataset.ptab));
document.querySelectorAll('.mask').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('on'); });

$('stats').innerHTML = DATA.meta.modules + ' 模块 · ' + DATA.meta.uses + ' 用途 · '
  + DATA.meta.categories + ' 类 · ' + DATA.meta.platforms + ' 平台 · '
  + DATA.meta.flow + ' 流程 · ' + DATA.meta.questions + ' 例题';

renderTOC();
renderHelp();
renderFlow();
setPTab('catalog');
setMode(S.openMode);
selectMod(S.sel, true);
</script>
