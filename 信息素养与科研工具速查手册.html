<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 信息素养与科研工具速查手册 v2.1 | 单文件离线运行 | 键盘打开网址走真实 <a> 激活 | 已应用网址勘误 -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信息素养与科研工具速查手册</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --dim:#5c6672; --line:#e2e6ea;
  --brand:#1e67ca; --brand-soft:#e8f2ff; --warn:#b45309; --warn-soft:#fef3c7;
  --ok:#15803d; --ok-soft:#dcfce7; --lock:#b91c1c; --lock-soft:#fee2e2;
  --kbd:#eef1f4; --kbd-line:#c9d1d9;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;}
kbd{display:inline-block;min-width:18px;padding:1px 5px;margin:0 1px;
  font:600 11px/1.5 ui-monospace,Consolas,monospace;color:#334;
  background:var(--kbd);border:1px solid var(--kbd-line);border-bottom-width:2px;
  border-radius:4px;text-align:center}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(0,0,0,.04);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{font-weight:400;color:var(--dim);margin-left:6px}
.search-wrap{position:relative;flex:1;min-width:260px}
#q{width:100%;padding:9px 12px 9px 34px;font-size:14px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);outline:none;font-family:inherit}
#q:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search-wrap::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:13px;opacity:.6}
.hbtns{display:flex;gap:6px;align-items:center}
.hbtns button{padding:6px 10px;font:inherit;font-size:12.5px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink)}
.hbtns button:hover{border-color:var(--brand);color:var(--brand)}
.stats{color:var(--dim);font-size:12.5px;white-space:nowrap}

main{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 57px)}
#side{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:8px 0 40px}
#detail{overflow-y:auto;padding:20px 26px 60px}

.use{border-bottom:1px solid var(--line)}
.use-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;
  font-weight:600;font-size:13.5px;user-select:none}
.use-head:hover{background:var(--brand-soft)}
.use-head .cnt{margin-left:auto;font-weight:400;color:var(--dim);font-size:11.5px}
.use.open .use-head{background:var(--brand-soft);color:var(--brand)}
.use .mods{display:none;padding-bottom:4px}
.use.open .mods{display:block}
.mod{display:flex;gap:7px;align-items:baseline;padding:5px 12px 5px 16px;cursor:pointer;
  font-size:13px;border-left:3px solid transparent}
.mod:hover{background:#f0f4f9}
.mod.sel{background:var(--brand-soft);border-left-color:var(--brand);font-weight:600}
.mod .idx{font:600 10.5px/1.6 ui-monospace,Consolas,monospace;color:#889;flex:none}
.mod.sel .idx{color:var(--brand)}

h1{font-size:19px;margin:0 0 6px}
.crumb{color:var(--dim);font-size:12.5px;margin-bottom:14px}
.crumb b{color:var(--brand)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.actions a,.actions button{padding:6px 12px;font:inherit;font-size:12.5px;border-radius:7px;
  border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.actions a:hover,.actions button:hover{border-color:var(--brand);color:var(--brand);text-decoration:none}

section{margin-bottom:22px}
h2{font-size:14px;margin:0 0 9px;padding-bottom:6px;border-bottom:2px solid var(--brand-soft);
  color:var(--brand);letter-spacing:.3px}
ul.req{margin:0;padding-left:20px}
ul.req li{margin:3px 0}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:5px 8px;border-radius:6px;margin-bottom:3px}
ul.plain li:nth-child(odd){background:#fafbfc}

.q{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px;background:#fff}
.q .qtype{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand);font-weight:600;margin-bottom:7px}
.q .stem{font-weight:600;margin-bottom:8px}
.q .opts{margin:0 0 8px;padding-left:0;list-style:none;color:#333}
.q .opts li{padding:1px 0}
.ans{background:var(--ok-soft);color:#14532d;padding:6px 10px;border-radius:6px;font-weight:600;
  display:inline-block;margin-bottom:6px}
.exp{color:#444;font-size:13px;border-left:3px solid var(--line);padding-left:10px}

ol.links{list-style:none;margin:0;padding:0;counter-reset:none}
ol.links li{display:flex;gap:9px;align-items:flex-start;padding:6px 8px;border-radius:7px;
  margin-bottom:2px}
ol.links li:nth-child(odd){background:#fafbfc}
ol.links li.hot{outline:2px solid var(--brand);background:var(--brand-soft)}
.lk{flex:1;min-width:0;word-break:break-all}
.lk .lab{font-weight:600}
.lk .u{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
.tag{flex:none;font-size:10.5px;padding:1px 6px;border-radius:99px;white-space:nowrap}
.tag.login{background:var(--lock-soft);color:var(--lock)}
.tag.mixed{background:var(--warn-soft);color:var(--warn)}
.tag.gov{background:#e0e7ff;color:#3730a3}
.tag.open{background:var(--ok-soft);color:var(--ok)}
.hint{color:var(--dim);font-size:12px;margin-bottom:8px}

.mask{position:fixed;inset:0;background:rgba(15,20,26,.45);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:70px 16px 20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(880px,100%);max-height:78vh;overflow:auto;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;
  position:sticky;top:0;background:#fff;z-index:2}
.modal .body{padding:14px 18px 20px}
.kbdgrid{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center}
.kbdgrid .k{white-space:nowrap}
.kbdgrid .d{color:#333}
.kgroup{grid-column:1/-1;margin-top:12px;font-weight:700;color:var(--brand);font-size:13px}
.plat{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer}
.plat:hover{background:var(--brand-soft)}
.plat.hot{outline:2px solid var(--brand);background:var(--brand-soft)}
.plat .nm{font-weight:600;min-width:180px}
.plat .hs{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace}
#platq{width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:7px;
  margin-bottom:10px;font:inherit;outline:none}
#platq:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

#results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.13);max-height:62vh;overflow:auto;
  display:none;z-index:60}
#results.on{display:block}
#results .r{padding:7px 12px;cursor:pointer;display:flex;gap:9px;align-items:baseline;
  border-bottom:1px solid #f2f4f6}
#results .r:last-child{border-bottom:0}
#results .r.hot{background:var(--brand-soft)}
#results .r .t{font-weight:600}
#results .r .s{color:var(--dim);font-size:11.5px;margin-left:auto;white-space:nowrap}
#results .r .u{color:#6b7280;font-size:11.5px;font-family:ui-monospace,Consolas,monospace;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.badge{font-size:10.5px;padding:1px 6px;border-radius:99px;background:#eef1f4;color:#556;flex:none}
.badge.mod{background:var(--brand-soft);color:var(--brand)}
.badge.url{background:var(--ok-soft);color:var(--ok)}

@media(max-width:860px){
  main{grid-template-columns:1fr;height:auto}
  #side{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}
  #detail{padding:16px}
}

/* 打开方式切换按钮 —— 命中时高亮“当前标签页”这一更保守的模式 */
#btn-mode{font-weight:600}
#btn-mode.same{background:var(--warn-soft);border-color:#f0c36d;color:var(--warn)}

/* 轻提示：网址被打开后显示，并提供“复制链接”兜底 */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);
  display:none;align-items:center;gap:10px;max-width:92vw;
  padding:9px 12px;background:#1f2937;color:#f3f4f6;border-radius:9px;
  box-shadow:0 10px 26px rgba(0,0,0,.3);font-size:12.5px;z-index:200}
#toast.on{display:flex;animation:tin .18s ease-out forwards}
@keyframes tin{to{transform:translate(-50%,0)}}
#toast .tmsg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw;
  font-family:ui-monospace,Consolas,monospace}
#toast button{padding:4px 9px;font:inherit;font-size:12px;border-radius:6px;cursor:pointer;
  border:1px solid #4b5563;background:#374151;color:#f3f4f6;flex:none}
#toast button:hover{border-color:#9ca3af}
#toast .tclose{background:transparent;border:0;font-size:15px;line-height:1;padding:2px 4px}
</style>
</head>

gin","src":"page"},{"u":"https://ai.cnki.net/chat/home","label":"CNKI AI","host":"ai.cnki.net","access":"login","src":"page"},{"u":"https://paper.iflytek.com/","label":"https://paper.iflytek.com/","host":"paper.iflytek.com","access":"open","src":"page"},{"u":"https://www.sciencedirect.com/leapspace/","label":"https://www.sciencedirect.com/leapspace/","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://eci.elsevier.cn/resource/LeapSpace.html?fid=165&menuid=358&infoid=2004","label":"https://eci.elsevier.cn/resource/LeapSpace.html?fid=165&menuid=358&infoid=2004","host":"eci.elsevier.cn","access":"login","src":"page"},{"u":"https://mp.weixin.qq.com/s/yMzjuReWiBDgP6sJLkSA-A","label":"https://mp.weixin.qq.com/s/yMzjuReWiBDgP6sJLkSA-A","host":"mp.weixin.qq.com","access":"open","src":"page"}],"kw":["LeapSpace","Research","Writing","AMiner","Claim","Coach","Radar","Trust","CNKI","Card","Deep"]},{"no":6,"id":"ecee935f-46a5-11f0-8ca6-b8599f11e190","title":"知识模块06：多模态AI工具","use":"U1","legacy":"AI素养","detail":"https://csc.xxsuyang.com/detail?id=ecee935f-46a5-11f0-8ca6-b8599f11e190","req":["1. 熟悉豆包、智谱清言、万相（通义万相）、可灵AI的图像生成、视频生成功能。","2. 熟悉豆包的音乐生成功能。","3. 熟悉文心、讯飞星火的图像生成功能。","4. 了解闪剪、蝉镜等数字人工具。"],"explore":[],"questions":[{"type":"多选题","stem":"使用AI工具豆包可以生成音乐，入口在官网首页对话框下方。使用豆包的这个功能生成音乐，系统会给出提示词模板，其中可以选择音乐风格，其中包括（）。","options":[["A","DJ"],["B","民谣"],["C","戏曲"],["D","朋克"]],"answer":"ABD","explain":"在电脑浏览器中访问豆包（https://www.doubao.com），点击对话框下方的“音乐生成”，打开提示词模板中的音乐风格下拉菜单，可以看到答案。"}],"links":[{"u":"https://www.doubao.com/","label":"https://www.doubao.com","host":"www.doubao.com","access":"open","src":"page"},{"u":"https://www.doubao.com","label":"","host":"www.doubao.com","access":"open","src":"page"}],"kw":[]},{"no":7,"id":"ecee8d99-46a5-11f0-8ca6-b8599f11e190","title":"知识模块07：AI开源与开放数据资源的获取与利用","use":"U1","legacy":"AI素养","detail":"https://csc.xxsuyang.com/detail?id=ecee8d99-46a5-11f0-8ca6-b8599f11e190","req":["1. 了解AI开源生态与开放数据资源的基本类型，包括开源代码、开源项目、开源模型、开放数据集、数据竞赛资源、模型说明、数据集说明、README文件、许可证信息等。","2. 能够通过 GitHub（https://github.com）查找 AI 相关开源项目，查看项目名称、作者或机构、README 文件、项目简介、更新时间、License 许可证、Release 或下载入口等信息。","3. 能够通过魔搭社区 ModelScope（https://modelscope.cn）查找AI模型、数据集和应用体验资源，查看模型或数据集名称、任务类型、资源简介、使用方式、许可证信息和下载入口。","4. 能够通过百度AI Studio飞桨星河社区（https://aistudio.baidu.com）查找AI项目、模型应用案例和开放数据集，查看资源名称、任务类型、内容简介、数据格式、使用方式和下载入口。","5. 能够通过和鲸社区HeyWhale、阿里云天池数据集、DataFountain、OpenDataLab、OpenML、UCI Machine Learning Repository（Classic 版：https://archive.ics.uci.edu；Beta 版：https://archive-beta.ics.uci.edu）等平台查找人工智能、机器学习和数据科学相关开放数据集，并能够查看数据集简介、数据类型、文件格式、字段说明、样本数量、下载方式和使用限制。"],"explore":[],"questions":[{"type":"多选题","stem":"在 GitHub中有一个名为“ONNX”的项目，进入该项目的 LICENSES/Apache-2.0.txt 文件页面，该文件的Last commit message是什么？（ ），Last commit date是多久？（ ）。","options":[["A","update license to Apache License v2.0 (#3159)"],["B","Introduce Reuse Infra (#5028)"],["C","3 years ago"],["D","5 years ago"]],"answer":"BC","explain":"进入GitHub，找到开源项目ONNX，在https://github.com/onnx/onnx/tree/main/LICENSES页面可以查看到，或者直接与GitHub的AI进行对话获取（该方式有一定出错概率）。"}],"links":[{"u":"https://github.com/","label":"https://github.com","host":"github.com","access":"open","src":"page"},{"u":"https://modelscope.cn/","label":"https://modelscope.cn","host":"modelscope.cn","access":"open","src":"page"},{"u":"https://aistudio.baidu.com/","label":"https://aistudio.baidu.com","host":"aistudio.baidu.com","access":"open","src":"page"},{"u":"https://www.heywhale.com/home/dataset","label":"和鲸社区HeyWhale","host":"www.heywhale.com","access":"open","src":"page"},{"u":"https://tianchi.aliyun.com/dataset","label":"阿里云天池数据集","host":"tianchi.aliyun.com","access":"open","src":"page"},{"u":"https://www.datafountain.cn/","label":"DataFountain","host":"www.datafountain.cn","access":"open","src":"page"},{"u":"https://opendatalab.com/","label":"OpenDataLab","host":"opendatalab.com","access":"open","src":"page"},{"u":"https://www.openml.org/search?type=data","label":"OpenML","host":"www.openml.org","access":"open","src":"page"},{"u":"https://ar 平系列重要讲话数据库”中以全文为检索点，以“数字货币”为检索词，可以找到至少多条记录，其中可以发现 2020 年 10 月 31 日在《求是》发表的《国家中长期经济社会发展战略若干重大问题》署名文章中就提到了“数字货币”，所以题目表述错误。"}],"links":[{"u":"http://jhsjk.people.cn","label":"http://jhsjk.people.cn","host":"jhsjk.people.cn","access":"open","src":"page"},{"u":"https://www.12371.cn","label":"https://www.12371.cn","host":"www.12371.cn","access":"open","src":"page"},{"u":"https://xhsz.news.cn/","label":"https://xhsz.news.cn","host":"xhsz.news.cn","access":"open","src":"page"},{"u":"https://xhsz.news.cn","label":"","host":"xhsz.news.cn","access":"open","src":"page"}],"kw":["jhsjk.people.cn","www.12371.cn","xhsz.news.cn","https","http","mp4"]},{"no":9,"id":"ecee97ae-46a5-11f0-8ca6-b8599f11e190","title":"知识模块09：开放数据资源","use":"U4","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee97ae-46a5-11f0-8ca6-b8599f11e190","req":["1. 能够通过国家统计局网站上的数据查询系统（https://data.stats.gov.cn/dg/website/page.html#/pc/national/home ，可能会有风险提示，忽略即可）查询统计数据。","2. 能够在国家统计局、各省市统计局、各部委官网中找到各种统计年鉴，并且从中找到指定指标数据。","3. 能够找到各省会城市和副省级城市的政府公共数据开放平台，并且从中找到指定数据或数据集。","4. 通过国家科学数据中心（https://www.escience.org.cn/data-center）旗下的20个具体学科科学数据中心获取指定数据资源。","5. 能够通过科学数据银行 ScienceDB（https://www.scidb.cn）获取指定科学数据资源。","6. 能够通过世界银行（https://data.worldbank.org）等国际组织网站中的开放数据平台查询指定数据和数据集。","7. 能够利用AI知数等数据智能分析平台，查询并分析经济、人口、教育、科技等领域的指标数据，完成指标检索、地区比较、时间趋势分析和简单数据运算。"],"explore":["1. 根据学习要求中提供的网址，深度体验、探索，熟悉这些网站的内容。","2. 探索：能够获取的最近一年的《海南统计年鉴》共有多少页？各省市统计年鉴一般可以在对应地方政府统计局网站中找到，虽然每个网站的界面不一样，但统计年鉴存放的位置一般比较明显，大部分可以在首页中找到。","3. 探索：能不能找到深圳市公共厕所的相关数据集？各地方政府的开放数据平台，最好能够获取其中的数据集（xlsx、csv、rdf、xml等格式文件）。","4. 探索：在世界银行的开放数据平台中对比我国和美国、日本、德国的GDP数据。","5. 探索：在科学数据银行 ScienceDB 中查找一个科学数据集，查看其题名、作者、发布时间、DOI 或 CSTR、数据文件和下载方式。"],"questions":[{"type":"单选题","stem":"在国家统计局官网的数据查询 系统中查找我国普通本专科生毕业人数。请问：2018 年我国普通本专科毕业生人数是多少万？（ ）","options":[["A","801.2213"],["B","797.1991"],["C","758.5298"],["D","753.3087"]],"answer":"D","explain":"登录国家统计局网站，点击“统计数据”菜单中找到数据查询，在查询页面输入关键词“普通本专科生毕业人数”，在找到的数据项中点击 相关报表，右上角选择“最近10年”，即可看到答案。"},{"type":"单选题","stem":"根据AI知数分析数据，2025年，我国哪个省份城镇居民人均可支配收入最高？（）","options":[["A","北京"],["B","上海"],["C","浙江"],["D","天津"]],"answer":"B","explain":"通过AI知数搜索“2025年全国各省城镇居民人均可支配收入”，在结果页点击数据运算的按列计算最大值。"}],"links":[{"u":"file:///C:/Users/15275/Desktop/2026%E5%B9%B4%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E5%A4%A7%E8%B5%9B/2026%E5%B9%B4%E5%A4%A7%E5%AD%A6%E7%94%9F%E2%80%9DAI+%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E2%80%9C%E5%A4%A7%E8%B5%9B%E5%AE%A2%E8%A7%82%E9%A2%98%E5%91%BD%E9%A2%98%E8%8C%83%E5%9B%B4%E5%8F%8A%E5%A4%87%E8%B5%9B%E5%BB%BA%E8%AE%AE%EF%BC%882026.7.7%E5%8F%91%E5%B8%83%EF%BC%89/2026%E5%B9%B4%E5%A4%A7%E5%AD%A6%E7%94%9F%E2%80%9DAI+%E4%BF%A1%E6%81%AF%E7%B4%A0%E5%85%BB%E2%80%9C%E5%A4%A7%E8%B5%9B%E5%AE%A2%E8%A7%82%E9%A2%98%E5%91%BD%E9%A2%98%E8%8C%83%E5%9B%B4%E5%8F%8A%E5%A4%87%E8%B5%9B%E5%BB%BA%E8%AE%AE%EF%BC%882026.7.8%E4%BF%AE%E8%AE%A2%EF%BC%89.docx#/pc/national/home","label":"https://data.stats.gov.cn/dg/website/page.html#/pc/national/home","host":"","access":"open","src":"page"},{"u":"https://www.escience.org.cn/data-center","label":"https://www.escience.org.cn/data-center","host":"www.escience.org.cn","access":"gov","src":"page"},{"u":"https://www.scidb.cn","label":"https://www.scidb.cn","host":"www.scidb.cn","access":"open","src":"page"},{"u":"https://data.worldbank.org/","label":"https://data.worldbank.org","host":"data.worldbank.org","access":"open","src":"page"},{"u":"https://mp.weixin.qq.com/s/uWR2BMvQtpuGkv9oXTZDdQ","label":"https://mp.weixin.qq.com/s/uWR2BMvQtpuGkv9oXTZDdQ","host":"mp.weixin.qq.com","access":"open","src":"page"},{"u":"https://data.stats.gov.cn/dg/website/page.html#/pc/national/home","label":"","host":"data.stats.gov.cn","access":"gov","src":"page"},{"u":"https://data.worldbank.org","label":"","host":"data.worldbank.org","access":"open","src":"page"}],"kw":["www.escience.org.cn","data.worldbank.org","data.stats.gov.cn","www.scidb.cn","data-center","ScienceDB","page.html","national","website","海南统计年鉴","https","CSTR","home","xlsx","DOI","GDP","csv","rdf"]},{"no":10,"id":"ecee954d-46a5-11f0-8ca6-b8599f11e190","title":"知识模块10：法律信息资源","use":"U3","legacy":"政府开放信息","detail":"https://csc.xxsuyang.com/detail?id=ecee954d-46a5-11f0-8ca6-b8599f11e190","req":["1.能够使用国家法律法规数据库（https://flk.npc.gov.cn）查询我国各层级法律法规，特别是高级检索功能。","2.能够使用国家行政法规库（http://www.gov.cn/zhengce/xzfgk/; http://xzfg.moj.gov.cn/search2.html）查找指定行政法规。","3.能够使用国家规章库（https://www.gov.cn/zhengce/xxgk/gjgzk/index.htm；https://www.moj.gov.cn/pub/sfbgw/gwygzk/index.html)查找指定规章。","4.能够使用人民法院案例库（https://rmfyalk.court.gov.cn）查询指定案例。","5.能够使用最高人民法院公报检索系统（http://gongbao.court.gov.cn）查询法院公报。","6.能够使用中国执行信息网（http://zxgk.court.gov.cn）查询被执行人、失信被执行人、限制消费人员和终本案件。","7.能够使用中国庭审公开网（http://tingshen.court.gov.cn）查庭审视频。","8.能够使用中国裁判文书网（https://wenshu.court.gov.cn）查询公开的判决书。","9. 能够使用中国法律知识资源总库（https://lawpro.cnki.net/）查询法学论文、司法案例和法律法规。"],"explore":["1. 根据学习要求中提供的网址，深度体验、探索，熟悉这些网站中的内容。","2. 探索：在中国法律知识资源总库检索哪些法律法规中出现了“人工智能”这个词，以及如何通过关键词、案由、案情、裁判文书查询类案，分析类案。","3. 探索：看哪个法律法规中出现了“共享单车”这个词？","4. 探索：涉及本校的判决书有哪些？必须要看到完整全文哦。","5. 探索：在中国执行信息网（http://zxgk.court.gov.cn）查询被执行人、失信被执行人、限制消费人员，看看“张三”这个名字是否能查得到？能否找到相关详情？"],"questions":[{"type":"单选题","stem":"星河互联集团有限公司被列为失信被执行人，请问立案时间为2018年10月31日的法律判决需偿还申请执行人多少金额？（ ）","options":[["A","87065"],["B","92245"],["C","88910"],["D","83640"]],"answer":"B","explain":"中国执行信息公开网中搜索星河互联集团有限公司，找到对应日期的案号为(2018)京0108执17244号，点开详情即可查看。"},{"type":"多选题","stem":"在中国法律知识资源总库中查找案例有哪些入口？","options":[["A","案例库"],["B","业务助手"],["C","类案推送"],["D","一框式检索"]],"answer":"ABCD","explain":"登录中国法律知识资源总库后，可在页面看到“案例”“业务助手”“一框式检索”入口；点击案例库之后，可进一步点击“类案推送”查询类案。所以ABCD都是正确答案。"}],"links":[{"u":"https://flk.npc.gov.cn/","label":"https://flk.npc.gov.cn","host":"flk.npc.gov.cn","access":"gov","src":"page"},{"u":"http://www.gov.cn/zhengce/xzfgk/","label":"http://www.gov.cn/zhengce/xzfgk/","host":"www.gov.cn","access":"gov","src":"page"},{"u":"http://xzfg.moj.gov.cn/search2.html","label":"http://xzfg.moj.gov.cn/search2.html","host":"xzfg.moj.gov.cn","access":"gov","src":"page"},{"u":"https://www.gov.cn/zhengce/xxgk/gjgzk/index.htm", "D","PDF 压缩"]],"answer":"ABCD","explain":"进入云展网 PDF 在线工具页面（https://www.yunzhan365.com/tools/pdf-to-word），可以看到 PDF 转 Word、PDF 合并、PDF 拆分、PDF 压缩等常用 PDF 处理工具。"}],"links":[{"u":"https://www.yunzhan365.com/tools/pdf-to-word","label":"https://www.yunzhan365.com/tools/pdf-to-word","host":"www.yunzhan365.com","access":"open","src":"page"}],"kw":["www.yunzhan365.com","pdf-to-word","EXCEL","https","tools","WORD","PDF","PPT"]},{"no":42,"id":"ecee9623-46a5-11f0-8ca6-b8599f11e190","title":"知识模块42：学术评价与投稿选刊","use":"U9","legacy":"学术写作","detail":"https://csc.xxsuyang.com/detail?id=ecee9623-46a5-11f0-8ca6-b8599f11e190","req":["1. 掌握影响因子、H指数的含义、计算、查询。","2. 能够使用CNKI、万方、维普判断一本中文期刊/文章是不是在SCI、CSSCI、北大核心、CSCD、AMI收录范围内。","3. 能够通过国家新闻出版署提供的期刊查询系统（https://www.nppa.gov.cn/bsfw/cyjghcpcx）查询期刊信息，判断期刊真伪。","4. 能够使用CNKI写作投稿服务平台（xztg.cnki.net）追踪学术热点、选题分析、智能选刊（其他商用功能不命题）","5. 能够使用LeapSpace匹配合适的投稿期刊。"],"explore":["3. 探索：《会计之友》是不是正规的期刊？是不是北大核心期刊？是不是CSSCI期刊？是不是AMI期刊？是不是CSCD期刊？在CNKI中的综合影响因子和复合影响因子分别是多少？","4. 探索：在CNKI写作投稿服务平台页面，输入篇名、摘要等信息，适配对应期刊。","5. 探索：在 LeapSpace 中通过提示词（如“研究方向”、“期刊匹配”、“分区解读”、“投稿匹配矩阵”等），适配对应期刊。"],"questions":[{"type":"多选题","stem":"刊发学术论文《基于认捐模式的图书馆受赠研究》的期刊属于（ ）期刊。","options":[["A","CSSCI"],["B","SSCI"],["C","北大核心"],["D","CSCD"]],"answer":"AC","explain":"在CNKI（或万方、维普）中找到这篇论文，确定所在期刊，进入期刊主页，即可看到答案。"}],"links":[{"u":"https://www.nppa.gov.cn/bsfw/cyjghcpcx","label":"https://www.nppa.gov.cn/bsfw/cyjghcpcx","host":"www.nppa.gov.cn","access":"gov","src":"page"},{"u":"https://www.sciencedirect.com/leapspace","label":"LeapSpace","host":"www.sciencedirect.com","access":"login","src":"page"},{"u":"https://mp.weixin.qq.com/s/nT8hcUnQj6TmvsW1RK5Emw?click_id=451899144","label":"https://mp.weixin.qq.com/s/nT8hcUnQj6TmvsW1RK5Emw?click_id=451899144","host":"mp.weixin.qq.com","access":"open","src":"page"}],"kw":["www.nppa.gov.cn","xztg.cnki.net","LeapSpace","cyjghcpcx","CSSCI","https","CNKI","CSCD","bsfw","会计之友","AMI","SCI"]},{"no":43,"id":"ecee939a-46a5-11f0-8ca6-b8599f11e190","title":"知识模块43：学术伦理","use":"U9","legacy":"学术写作","detail":"https://csc.xxsuyang.com/detail?id=ecee939a-46a5-11f0-8ca6-b8599f11e190","req":["1. 了解学术伦理，树立学术诚信意识，了解学术不端行为以及学术不端问题带来的危害。","2. 熟悉行业标准《学术出版规范 期刊学术不端行为界定》（CY/T 174—2019）以及教育部颁布的《高等学校预防与处理学术不端行为办法》中列出的学术不端行为。","3. 熟悉2023年科技部监督司发布的《负责任研究行为规范指引（2023）》的规范引用指南，尤其对生成式人工智能内容的引用规则仔细理解。","4. 能够使用万方数据科研诚信培训系统（https://cx.wanfangdata.com.cn/e-training）查找指定资源。（免费注册个人账号后，可免费观看直播、公益讲座等内容。）"],"explore":[],"questions":[{"type":"多选题","stem":"下列行为，属于“一稿多投”的是（ ）。","options":[["A","论文以不同或同一种文字在同一种期刊的国际版本上再次发表"],["B","将主要数据和图表相同的两篇论文分别投稿不同期刊"],["C","将同一篇论文同时投稿多家期刊"],["D","将发表过的会议论文充实50%以上数据后再次向期刊投稿，引用上次发表的论文并向编辑部说明"]],"answer":"BC","explain":"论文以不同或同一种文字在同一种期刊的国际版本上再次发表，或者将发表过的会议论文充实50%以上数据后再次向期刊投稿，引用上次发表的论文并向编辑部说明不属于“一稿多投”。"}],"links":[{"u":"https://cx.wanfangdata.com.cn/e-training","label":"https://cx.wanfangdata.com.cn/e-training","host":"cx.wanfangdata.com.cn","access":"login","src":"page"}],"kw":["cx.wanfangdata.com.cn","学术出版规范 期刊学术不端行为界定","负责任研究行为规范指引（2023）","高等学校预防与处理学术不端行为办法","e-training","https"]},{"no":44,"id":"ecee9666-46a5-11f0-8ca6-b8599f11e190","title":"知识模块44：参考文献著录格式","use":"U9","legacy":"学术写作","detail":"https://csc.xxsuyang.com/detail?id=ecee9666-46a5-11f0-8ca6-b8599f11e190","req":["1. 掌握GB/T 7714-2025、APA、MLA等参考文献著录格式。","2. 能够查询、确定指定期刊要求的参考文献著录格式。","3. 能够在CNKI、万方、维普中按照指定格式导出文献题录。"],"explore":["2. 探索：找几本被SCI收录期刊，查看其中文章的参考文献，确定具体格式。","3. 探索：从CNKI中查找文献，选定期刊论文、学位论文、会议论文、标准、专利各一篇，按照GB/T 7714-2025的格式导出。"],"questions":[{"type":"单选题","stem":"以下哪一种符合GB/T 7714-2025参考文献著录标准？（ ）","options":[["A","朱晓灿.新时代科普类图书出版趋势探析.传播与版权[J],2021(9):29-31+41."],["B","朱晓灿.\"新时代科普类图书出版趋势探析.\"传播与版权,2021(9):29-31+41."],["C","朱晓灿.新时代科普类图书出版趋势探析[J].《传播与版权》,2021(9):29-31+41."],["D","朱晓灿.新时代科普类图书出版趋势探析[J].传播与版权,2021(9):29-31+41."]],"answer":"D","explain":"对照国家标准著录。从CNKI、万方等学术数据库中也可以导出。"}],"links":[{"u":"https://publishmedia.cbpt.cnki.net/portal/minio/webs/zghd/media/web/2026/05/28/%E6%96%87%E5%90%8E%E5%8F%82%E8%80%83%E6%96%87%E7%8C%AE%E8%91%97%E5%BD%95%E8%A7%84%E5%88%99%EF%BC% 3、 能够从开放数据集平台下载 CSV、XLSX、JSON等常见格式数据，并利用 EXCEL 或 AI 工具进行简单的数据清洗、筛选、统计和分析。"],"explore":["2、 探索：基于excel中的数据，让AI给出实现具体需求的excel函数。","3、 探索：从百度 AI Studio、阿里云天池、OpenDataLab、OpenML 或 UCI Machine Learning Repository（Classic 版或 Beta 版）中下载一个表格型数据集，查看其字段名称、样本数量、数据格式和缺失值情况，并基于下载的数据集，让 AI 工具给出 EXCEL 函数或数据处理步骤，并对结果进行人工核验。"],"questions":[{"type":"单选题","stem":"在EXCEL中提取身份证号码中的出生年月日，最合适的函数是（）函数。","options":[["A","left( )"],["B","right( )"],["C","mid( )"],["D","trim( )"]],"answer":"C","explain":"在EXCEL中，mid()函数可以在指定的字符串中从指定的字符开始提取指定数量的字符。如果身份证号码在A1单元格，提取出生年月日的函数表达是：=mid(A1,7,8)。LEFT（）函数可以提取最左边的指定数量字符。"}],"links":[{"u":"https://www.epsnet.com.cn/index.html","label":"EPS数据平台","host":"www.epsnet.com.cn","access":"open","src":"supp"},{"u":"https://public.tableau.com/app","label":"Tableau Public","host":"public.tableau.com","access":"open","src":"supp"},{"u":"https://www.weiciyun.com/","label":"微词云","host":"www.weiciyun.com","access":"open","src":"supp"},{"u":"https://echarts.apache.org/zh/index.html","label":"Apache ECharts","host":"echarts.apache.org","access":"open","src":"supp"}],"kw":["OpenDataLab","Repository","SUBSTITUTE","COUNTIFS","Learning","COUNTIF","Classic","Machine","REPLACE","VLOOKUP","CONCAT","OpenML","SUMIFS","Studio","CLEAN","EXCEL","INDEX","MATCH"]},{"no":49,"id":"ecee9771-46a5-11f0-8ca6-b8599f11e190","title":"知识模块49：数据可视化工具","use":"U10","legacy":"科研工具","detail":"https://csc.xxsuyang.com/detail?id=ecee9771-46a5-11f0-8ca6-b8599f11e190","req":["1、 熟悉ECharts（https://echarts.apache.org/zh/index.html）可视化图表库。","2、 能够使用常用AI工具结合ECharts生成包含JavaScript代码的HTML网页，呈现可视化图形。","3、 熟悉AI工具豆包的数据分析功能。","4、 能够使用微词云（https://www.weiciyun.com）统计长文本词频并生成词云图（非会员每日只能免费使用三次词频统计，请同学们在考试当天谨慎使用此功能！！！）。","5、 能够基于开放数据集平台获取的数据，使用 ECharts、EXCEL 图表或 AI 工具生成基础可视化图表，并能够判断图表类型与数据类型是否匹配。"],"explore":["2、探索：ECharts中有哪些图表，要能够找到，并且能看到代码和效果。","3、探索：基于excel中的数据，让AI结合echarts生成网页代码，生成炫酷图表。","4、探索：今年政府工作报告的高频动词，排名前十的是哪几个？用高频名词做一个点赞手势词云图。"],"questions":[{"type":"判断题","stem":"在微词云（ https://www.weiciyun.com ）中统计2021年总理所做的政府工作报告。可以发现，“经济”这个词出现的次数高于“发展”。（ ）","options":[],"answer":"错误","explain":"先找到2021年的政府工作报告，全文复制。在微词云网站上选择“在线分词”，粘贴复制的文本，然后下一步。微信扫码关注后即可看到结果。“发展”的词频高于“经济”。"}],"links":[{"u":"https://echarts.apache.org/zh/index.html","label":"https://echarts.apache.org/zh/index.html","host":"echarts.apache.org","access":"open","src":"page"},{"u":"https://www.weiciyun.com/","label":"https://www.weiciyun.com","host":"www.weiciyun.com","access":"open","src":"page"},{"u":"https://www.weiciyun.com","label":"","host":"www.weiciyun.com","access":"open","src":"page"}],"kw":["echarts.apache.org","www.weiciyun.com","JavaScript","index.html","ECharts","echarts","EXCEL","excel","https","HTML"]},{"no":50,"id":"ecee973e-46a5-11f0-8ca6-b8599f11e190","title":"知识模块50：文献可视化工具","use":"U10","legacy":"科研工具","detail":"https://csc.xxsuyang.com/detail?id=ecee973e-46a5-11f0-8ca6-b8599f11e190","req":["1. 了解文献可视化（知识图谱）工具，如CiteSpace、VOSViewer等。","2. 熟练掌握赛特新思（https://www.citexs.com/Paperpicky）的文献调研分析功能。","3. 熟练掌握CNKI及CNKI AI(ai.cnki.net)、万方数据知识服务平台、维普中文期刊服务平台的文献可视化分析功能。"],"explore":["5. 探索：在赛特新思的文献调研分析功能界面中，学科选择“医学”，关键词输入“大数据”，可视化图形中圆圈最大的文献是哪一篇？","6. 探索：2020—2025年西安交通大学发表CSSCI论文数量排名前5的作者依次是？","7. 探索：在CNKI AI文献计量分析功能界面，输入研究方向，了解近十年发文趋势"],"questions":[{"type":"单选题","stem":"请问2011年至2020年间以“四川师范大学”为第一作者单位发表CSSCI论文最多的作者是（ ）。","options":[["A","谭光辉"],["B","汪洪亮"],["C","唐代兴"],["D","蔡方鹿"]],"answer":"C","explain":"CSSCI论文，一般在中文期刊论文数据库中检索，其中比较常用的是CNKI、维普、万方。在这三个数据库中，只有CNKI有“第一单位”（第一作者单位）这个检索点。所以选择CNKI。在CNKI的高级检索界面，文献类型选择“学术期刊”，检索点选择“第一单位”，检索词输入“四川师范大学”，匹配方式选择默认的“模糊”，时间限制2011-2020，来源期刊勾选“CSSCI”，然后点击“检索”。在检索结果页面，选择“导出与分析”→“可视化分析”→“全部检索结果分析”，在分析结果页面，选择“中国作者分布”项，即可看到高频作者排序柱状图。"}],"links":[{"u":"https://www.citexs.com/Paperpicky","label":"https://www.citexs.com/Paperpicky","host":"www.citexs.com","access":"open","src":"page"},{"u":"https://ai.cnki.net/chat/home","label":"ai.cnki.net","host":"ai.cnki.net","access":"login","src":"page"}],"kw":["www.citexs.com","ai.cnki.net","Paperpicky","CiteSpace","VOSViewer","CSSCI","https","CNKI /* ---------- 状态：优先 localStorage，其次 URL hash ----------
   某些环境（App 内置浏览器 / 沙箱预览）每次打开都会清空 origin 存储，
   因此把状态同时写进 URL hash，任何情况下都能靠链接本身恢复。 */
const HKEY = 'csc-qref-v2';
function loadState() {
  let st = {};
  try { st = JSON.parse(localStorage.getItem(HKEY) || '{}') || {}; } catch (e) { st = {}; }
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('m')) st.sel = +h.get('m');
  if (h.get('t')) st.openMode = h.get('t');
  return st;
}
function saveState() {
  const st = { sel: S.sel, openMode: S.openMode };
  try { localStorage.setItem(HKEY, JSON.stringify(st)); } catch (e) {}
  try {
    const q = 'm=' + st.sel + '&t=' + st.openMode;
    history.replaceState(null, '', location.pathname + location.search + '#' + q);
  } catch (e) {}
}

const _init = loadState();
const S = { sel: _init.sel && byNo[_init.sel] ? _init.sel : MODS[0].no,
            openMode: _init.openMode === 'same' ? 'same' : 'tab',
            nav: 'toc', li: -1, res: [], ri: 0, platList: [], pi: 0, openUse: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TAGS = { login:'需登录', mixed:'部分免费', gov:'公共机构', open:'公开' };

/* ---------- TOC ---------- */
function renderTOC() {
  let h = '';
  USES.forEach((u, i) => {
    const key = i < 9 ? 'Alt+' + (i + 1) : 'Alt+0';
    const open = S.openUse[u.id] !== false;
    var mods = MODS.filter(m => m.use === u.id);
    h += '<div class="use' + (open ? ' open' : '') + '" data-use="' + u.id + '">';
    h += '<div class="use-head" data-toggle="' + u.id + '"><kbd>' + key + '</kbd>'
       + '<span>' + esc(u.name) + '</span><span class="cnt">' + mods.length + ' 模块</span></div>';
    h += '<div class="mods">';
    mods.forEach((m, j) => {
      h += '<div class="mod' + (m.no === S.sel ? ' sel' : '') + '" data-no="' + m.no + '">'
         + '<span class="idx">' + u.id + '-' + (j + 1) + '</span>'
         + '<span>' + String(m.no).padStart(2, '0') + ' ' + esc(m.title.replace(/^知识模块\d+：/, '')) + '</span></div>';
    });
    h += '</div></div>';
  });
  $('side').innerHTML = h;
  $('side').querySelectorAll('.use-head').forEach(e => e.onclick = () => {
    const id = e.dataset.toggle; S.openUse[id] = S.openUse[id] === false; renderTOC();
  });
  $('side').querySelectorAll('.mod').forEach(e => e.onclick = () => selectMod(+e.dataset.no, true));
}

function jumpUse(i) {
  const u = USES[i]; if (!u) return;
  S.openUse[u.id] = true;
  const first = MODS.find(m => m.use === u.id);
  if (first) selectMod(first.no, false);
  renderTOC();
  const el = $('side').querySelector('.use[data-use="' + u.id + '"]');
  if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  S.nav = 'toc';
}

/* ---------- detail ---------- */

    h += '<div class="hint">数字键 <kbd>1</kbd>…<kbd>9</kbd> <kbd>0</kbd> 打开前 10 个；'
       + '按 <kbd>l</kbd> 进入链接导航模式后用 <kbd>↑</kbd><kbd>↓</kbd> 选择、<kbd>Enter</kbd> 打开。'
       + '若打开时总弹出“即将访问外部链接”确认框，按 <kbd>t</kbd> 切换为“当前标签页”方式。</div>';
    h += '<ol class="links">';
    m.links.forEach((l, i) => {

         + '<span class="lk"><a href="' + esc(l.u) + '" target="_blank" rel="noopener" class="lab">'
         + esc(l.label || host) + '</a><br><span class="u">' + esc(l.u.length > 110 ? l.u.slice(0, 110) + '…' : l.u)
         + '</span></span>'
         + '<span class="tag ' + l.access + '">' + (TAGS[l.access] || '') + '</span></li>';
    });
    h += '</ol></section>';
  } else {
    h += '<section><h2>🔗 资源链接</h2><div class="hint">该模块页面未给出独立链接，学习要点以官方“具体要求”为准；'
       + '可在搜索框输入平台名直接打开（如 <kbd>Kimi</kbd>、<kbd>知网</kbd>）。</div></section>';
  }
  m.questions.forEach((q, qi) => {

    if (q.type) h += '<div class="qtype">' + esc(q.type) + '</div>';

    if (q.options.length) h += '<ul class="opts">' + q.options.map(o => '<li>' + esc(o[0]) + '、' + esc(o[1]) + '</li>').join('') + '</ul>';
    if (q.answer) h += '<div class="ans">正确答案：' + esc(q.answer) + '</div>';
    if (q.explain) h += '<div class="exp">' + esc(q.explain) + '</div>';
    h += '</div></section>';
  });

  $('detail').innerHTML = h;
  $('detail').scrollTop = 0;
  $('detail').querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  $('detail').querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    const i = USES.findIndex(x => x.id === b.dataset.jump); jumpUse(i);
  });
  if (scrollTOC) {
    $('side').querySelectorAll('.mod').forEach(e => e.classList.toggle('sel', +e.dataset.no === no));
    const el = $('side').querySelector('.mod.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
}

function copy(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).catch(() => legacyCopy(t));
  } else { legacyCopy(t); }
  toast('已复制链接：' + t, t);
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) {}
}

/* ------------------------------------------------------------------
   打开网址：绝不使用 window.open()
   根因：window.open(url,'_blank','noopener') 带 features 参数，会被
   浏览器/WebView 判定为“弹出窗口(popup)”请求并拦截；被拦截时宿主
   环境会弹出“即将访问外部链接…”确认框。鼠标直接点 <a target=_blank>
   走的是普通链接导航，不经过 popup 判定，所以不会弹框。
   修复：改为激活一个真实 <a> 元素，让键盘操作与鼠标点击走同一条路径。
------------------------------------------------------------------ */
let _opener = null;
function openerAnchor() {
  if (!_opener) {
    _opener = document.createElement('a');
    _opener.style.display = 'none';
    _opener.rel = 'noopener noreferrer';
    document.body.appendChild(_opener);
  }
  return _opener;
}

function openURL(u) {
  if (!u) return;
  if (S.openMode === 'same') {                       // 当前标签页：普通导航
    try { location.assign(u); } catch (e) { location.href = u; }
    return;
  }
  const a = openerAnchor();                          // 新标签页：真实链接点击
  a.href = u;
  a.target = '_blank';
  a.click();
  toast('已在新标签页打开：' + u, u);
}

function openLink(i) {
  const m = byNo[S.sel]; const l = m && m.links[i];
  if (!l) return;
  openURL(l.u);
  const el = $('detail').querySelector('li[data-li="' + i + '"]');
  if (el) { el.classList.add('hot'); setTimeout(() => el.classList.remove('hot'), 700); }
}

/* 轻提示：即使被环境拦截，用户也能看到地址并手动复制 */
let _toastT = null;
function toast(msg, url) {
  const t = $('toast');
  t.innerHTML = '<span class="tmsg">' + esc(msg) + '</span>'
    + '<button class="tcopy" type="button">复制链接</button>'
    + '<button class="tclose" type="button">×</button>';
  t.classList.add('on');
  const btn = t.querySelector('.tcopy');
  if (btn) btn.onclick = () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).catch(() => legacyCopy(url));
    else legacyCopy(url);
    btn.textContent = '已复制 ✓';
  };
  const cl = t.querySelector('.tclose');
  if (cl) cl.onclick = () => t.classList.remove('on');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('on'), 6000);
}

/* ---------- search ---------- */
function search(q) {
  q = q.trim().toLowerCase();
  if (!q) { S.res = []; renderResults(); return; }
  const parts = q.split(/\s+/);
  const hit = s => parts.every(p => s.includes(p));
  const out = [];
  PLATS.forEach(p => { if (hit(p._blob)) out.push({ t: 'url', name: p.name, sub: p.host, url: p.url, score: p.name.toLowerCase().includes(q) ? 0 : 1 }); });
  MODS.forEach(m => { if (hit(m._blob)) out.push({ t: 'mod', name: m.title, sub: (byUse[m.use] || {}).name, no: m.no, score: m.title.toLowerCase().includes(q) ? 0 : 1 }); });
  out.sort((a, b) => a.score - b.score);
  S.res = out.slice(0, 60); S.ri = 0;
  renderResults();
}

function renderResults() {
  const box = $('results');
  if (!S.res.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = S.res.map((r, i) =>
    '<div class="r' + (i === S.ri ? ' hot' : '') + '" data-i="' + i + '">'
    + '<span class="badge ' + (r.t === 'url' ? 'url' : 'mod') + '">' + (r.t === 'url' ? '网址' : '模块') + '</span>'
    + '<span class="t">' + esc(r.name) + '</span>'
    + (r.t === 'url' ? '<span class="u">' + esc(r.sub) + '</span>' : '')
    + '<span class="s">' + esc(r.sub || '') + (r.t === 'mod' ? ' <kbd>Enter</kbd>' : ' <kbd>Enter</kbd> ↗') + '</span></div>'
  ).join('');
  box.classList.add('on');
  box.querySelectorAll('.r').forEach(e => {
    // 只切换高亮类，不重建 DOM —— 否则鼠标掠过会重置滚动位置
    e.onmouseenter = () => { S.ri = +e.dataset.i; hot(box, '.r', S.ri); };
    e.onclick = () => activateResult(+e.dataset.i);
  });
}

function hot(box, sel, i) {
  box.querySelectorAll(sel).forEach(e => e.classList.toggle('hot', +e.dataset.i === i));
}

function activateResult(i) {
  const r = S.res[i]; if (!r) return;
  if (r.t === 'url') { openURL(r.url); }
  else { selectMod(r.no, true); }
  $('q').value = ''; S.res = []; renderResults(); $('q').blur();
}

/* ---------- platform panel ---------- */
function renderPlats() {
  const q = ($('platq').value || '').trim().toLowerCase();
  const parts = q.split(/\s+/).filter(Boolean);
  const list = PLATS.filter(p => parts.every(x => p._blob.includes(x)));
  S.platList = list; S.pi = 0;
  const box = $('platlist');
  box.innerHTML = list.map((p, i) => {
    const k = i < 9 ? String(i + 1) : (i === 9 ? '0' : '·');
    return '<div class="plat" data-i="' + i + '">'
      + '<kbd>' + k + '</kbd><span class="nm">' + esc(p.name) + '</span>'
      + '<span class="hs">' + esc(p.host) + '</span>'
      + (p.src === 'supp' ? '<span class="tag mixed">补充</span>' : '')
      + '<span class="tag ' + p.access + '">' + (TAGS[p.access] || '') + '</span></div>';
  }).join('') || '<div class="hint">没有匹配的平台</div>';
  $('platcount').textContent = parts.length
    ? '匹配 ' + list.length + ' / ' + PLATS.length + ' 个平台'
    : '共 ' + PLATS.length + ' 个平台（按引用频次排序）';
  box.querySelectorAll('.plat').forEach(e => {
    e.onmouseenter = () => { S.pi = +e.dataset.i; hot(box, '.plat', S.pi); };
    e.onclick = () => openPlat(+e.dataset.i);
  });
}
function openPlat(i) { const p = S.platList[i]; if (p) openURL(p.url); }

/* ---------- help ---------- */
function renderHelp() {
  const K = s => '<kbd>' + esc(s) + '</kbd>';
  const rows = [
    ['g', '导航'],
    ['<kbd>?</kbd>', '显示 / 关闭本帮助'],
    ['<kbd>/</kbd> 或 <kbd>Ctrl</kbd>+<kbd>K</kbd>', '聚焦搜索框'],
    ['<kbd>Esc</kbd>', '清空搜索 / 关闭浮层'],
    ['<kbd>Alt</kbd>+<kbd>1</kbd> … <kbd>Alt</kbd>+<kbd>9</kbd>、<kbd>Alt</kbd>+<kbd>0</kbd>',
     '直达第 1–10 个用途分类'],
    ['<kbd>[</kbd> <kbd>]</kbd>', '上一个 / 下一个用途分类'],
    ['<kbd>↑</kbd> <kbd>↓</kbd> 或 ' + K('k') + ' ' + K('j'), '在模块目录中上下移动'],
    ['<kbd>Enter</kbd>', '打开选中的模块'],
    ['g', '网址'],
    ['<kbd>1</kbd> … <kbd>9</kbd> <kbd>0</kbd>', '打开当前模块的第 1–10 个资源链接（新标签页）'],
    ['<kbd>l</kbd>', '进入链接导航模式，' + K('↑') + K('↓') + ' 选链接、' + K('Enter') + ' 打开（第 11 个之后的链接）'],
    ['<kbd>p</kbd>', '打开 / 关闭「平台速查」面板（' + DATA.meta.platforms + ' 个平台）'],
    ['<kbd>t</kbd>', '切换网址打开方式：<b>新标签页 ↔ 当前标签页</b>（被环境拦截时改用当前标签页）'],
    ['<kbd>o</kbd>', '在新标签页打开当前模块的官网原页'],
    ['<kbd>y</kbd>', '复制当前模块的官网链接'],
    ['g', '搜索'],
    ['直接输入关键词', '同时搜模块标题、学习要点、关键词、平台、网址'],
    ['<kbd>↑</kbd> <kbd>↓</kbd>', '在搜索结果中切换'],
    ['<kbd>Enter</kbd>', '激活：模块 → 跳转；网址 → 打开'],
    ['平台速查面板内', '输入即过滤，<kbd>1</kbd>…<kbd>0</kbd> 直接打开前 10 个结果'],
  ];
  $('helpbody').innerHTML = '<div class="kbdgrid">' + rows.map(r => {
    if (r[0] === 'g') return '<div class="kgroup">' + r[1] + '</div>';
    return '<div class="k">' + r[0] + '</div><div class="d">' + r[1] + '</div>';
  }).join('') + '</div>';
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  const platOpen = $('mask-plat').classList.contains('on');
  const helpOpen = $('mask-help').classList.contains('on');

  if (e.key === 'Escape') {
    if (helpOpen) { $('mask-help').classList.remove('on'); return; }
    if (platOpen) { $('mask-plat').classList.remove('on'); return; }
    if ($('results').classList.contains('on')) { S.res = []; renderResults(); $('q').value = ''; $('q').blur(); return; }
    return;
  }
  if (e.key === '?' && !typing) { e.preventDefault(); $('mask-help').classList.toggle('on'); return; }
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); return; }

  if (helpOpen) return;

  // platform panel
  if (platOpen) {
    if (/^[0-9]$/.test(e.key) && e.target !== $('platq') || (e.altKey && /^[0-9]$/.test(e.key))) {
      const n = e.key === '0' ? 10 : +e.key; openPlat(n - 1); e.preventDefault(); return;
    }
    if (e.key === 'ArrowDown') { S.pi = Math.min(S.pi + 1, S.platList.length - 1); renderPlats(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { S.pi = Math.max(S.pi - 1, 0); renderPlats(); e.preventDefault(); return; }
    if (e.key === 'Enter') { openPlat(S.pi); e.preventDefault(); return; }
    return;
  }

  // search results
  if ($('results').classList.contains('on') && e.target === $('q')) {
    if (e.key === 'ArrowDown') { S.ri = Math.min(S.ri + 1, S.res.length - 1); renderResults(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { S.ri = Math.max(S.ri - 1, 0); renderResults(); e.preventDefault(); return; }
    if (e.key === 'Enter') { activateResult(S.ri); e.preventDefault(); return; }
  }

  if (e.altKey && /^[0-9]$/.test(e.key)) {
    const n = e.key === '0' ? 10 : +e.key; jumpUse(n - 1); e.preventDefault(); return;
  }
  if (typing) return;

  const cur = USES.findIndex(u => u.nos.includes(S.sel));
  if (e.key === 'p' || e.key === 'P') { e.preventDefault(); $('mask-plat').classList.toggle('on'); if ($('mask-plat').classList.contains('on')) { $('platq').value = ''; renderPlats(); $('platq').focus(); } return; }
  if (e.key === '[') { jumpUse((cur - 1 + USES.length) % USES.length); return; }
  if (e.key === ']') { jumpUse((cur + 1) % USES.length); return; }
  if (e.key === 'o' || e.key === 'O') { openURL(byNo[S.sel].detail); return; }
  if (e.key === 't' || e.key === 'T') { setMode(S.openMode === 'tab' ? 'same' : 'tab'); return; }
  if (e.key === 'y' || e.key === 'Y') { copy(byNo[S.sel].detail); return; }
  if (e.key === 'l' || e.key === 'L') { S.nav = (S.nav === 'links' ? 'toc' : 'links'); S.li = 0; hi(); return; }

  if (S.nav === 'links') {
    const n = byNo[S.sel].links.length;
    if (e.key === 'ArrowDown' || e.key === 'j') { S.li = Math.min(S.li + 1, n - 1); hi(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp' || e.key === 'k') { S.li = Math.max(S.li - 1, 0); hi(); e.preventDefault(); return; }
    if (e.key === 'Enter') { openLink(S.li); e.preventDefault(); return; }
  }

  if (/^[0-9]$/.test(e.key)) { openLink(e.key === '0' ? 9 : (+e.key - 1)); e.preventDefault(); return; }

  // module navigation
  const all = MODS.map(m => m.no);
  const i = all.indexOf(S.sel);
  if (e.key === 'ArrowDown' || e.key === 'j') { selectMod(all[Math.min(i + 1, all.length - 1)], true); e.preventDefault(); return; }
  if (e.key === 'ArrowUp' || e.key === 'k') { selectMod(all[Math.max(i - 1, 0)], true); e.preventDefault(); return; }
  if (e.key === 'Enter') { selectMod(S.sel, true); e.preventDefault(); return; }
});

function hi() {
  const m = byNo[S.sel];
  $('detail').querySelectorAll('li[data-li]').forEach(e =>
    e.classList.toggle('hot', +e.dataset.li === S.li));
  const el = $('detail').querySelector('li[data-li="' + S.li + '"]');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ---------- 打开方式 ---------- */
function setMode(m) {
  S.openMode = (m === 'same') ? 'same' : 'tab';
  const b = $('btn-mode');
  b.innerHTML = (S.openMode === 'same' ? '打开方式：当前标签页' : '打开方式：新标签页') + ' <kbd>t</kbd>';
  b.classList.toggle('same', S.openMode === 'same');
  saveState();
}

/* ---------- boot ---------- */
$('q').addEventListener('input', e => search(e.target.value));
$('q').addEventListener('focus', e => { if (e.target.value) search(e.target.value); });
$('platq').addEventListener('input', renderPlats);
$('btn-help').onclick = () => $('mask-help').classList.toggle('on');
$('btn-plat').onclick = () => { $('mask-plat').classList.add('on'); $('platq').value = ''; renderPlats(); $('platq').focus(); };
$('btn-mode').onclick = () => setMode(S.openMode === 'tab' ? 'same' : 'tab');
document.querySelectorAll('.mask').forEach(m => m.onclick = e => { if (e.target === m) m.classList.remove('on'); });

$('stats').innerHTML = DATA.meta.modules + ' 模块 · ' + DATA.meta.uses + ' 用途 · '
  + DATA.meta.platforms + ' 平台 · ' + DATA.meta.questions + ' 例题';

renderTOC();
renderHelp();
setMode(S.openMode);
selectMod(S.sel, true);
</script>
</body>
